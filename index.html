<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM-Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* PM-сетап look, spreadsheet layout: header, toolbar, cell bar, grid, status bar, sheet tabs at the bottom */
:root{
  --font-heading:"Barlow Condensed",system-ui,sans-serif; --font-body:"Barlow",system-ui,sans-serif; --font-mono:ui-monospace,Menlo,Consolas,monospace;
  --ink:#17324d; --ink-2:#1d4467; --text:#23303f; --text-2:#3f4a5c; --muted:#6b7689; --muted-2:#7b879a; --muted-3:#9aa6b6;
  --page:#eef2f8; --frame:#b8c3d4; --rule:#dfe6ef; --rule-2:#e6ebf2; --rule-3:#eef2f7; --band:#e4ebf4; --band-2:#eff3f8;
  --label-bg:#f2f5f9; --soft:#f7f9fc; --mark:#3d86c6; --honey:#8a6410; --teal:#10635f; --danger:#a8432f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--page);overflow:hidden}
body{font-family:var(--font-body);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:#2c5f8f;text-underline-offset:2px}
[hidden]{display:none!important}
::selection{background:#c5dff7}
#app{height:100%;display:flex;flex-direction:column}

/* header */
.hdr{flex:none;display:flex;align-items:center;gap:12px;height:40px;padding:0 14px;background:var(--ink);color:#dce6f2}
.brand{font-family:var(--font-heading);font-size:14px;font-weight:600;letter-spacing:.22em;color:#fff;padding-right:12px;border-right:1px solid #2f4b6b}
.hdr select{height:26px;background:#1d3d5c;color:#fff;border:1px solid #2f4b6b;border-radius:2px;padding:0 6px;font-weight:600}
.saved{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#8fa6c2}
.saved.busy{color:#f3d489}
.hdr .sp{flex:1}
.hdr .who{font-family:var(--font-mono);font-size:10.5px;color:#8fa6c2}
.hbtn{border:1px solid #2f4b6b;background:none;color:#dce6f2;border-radius:2px;height:24px;padding:0 8px;font-family:var(--font-heading);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.hbtn:hover{background:#1d3d5c}

/* toolbar + cell bar */
.tb{flex:none;display:flex;align-items:center;gap:4px;height:38px;padding:0 10px;background:#fff;border-bottom:1px solid var(--rule)}
.tbtn{height:26px;padding:0 9px;border:1px solid transparent;background:none;border-radius:3px;font-family:var(--font-heading);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--band-2);border-color:var(--rule)}
.tbtn.pri{background:var(--ink);color:#fff}.tbtn.pri:hover{background:var(--ink-2)}
.tbtn:disabled{opacity:.4;cursor:default}
.tsep{width:1px;height:20px;background:var(--rule);margin:0 5px}
.tb .sp{flex:1}
.search{height:26px;width:200px;border:1px solid var(--rule);border-radius:3px;padding:0 8px;background:var(--soft)}
.search:focus,.cb input:focus{outline:2px solid var(--mark);outline-offset:-1px;background:#fff}
.cb{flex:none;display:flex;align-items:center;height:30px;background:#fff;border-bottom:1px solid var(--frame)}
.cb .ref{flex:none;width:300px;padding:0 12px;font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--rule)}
.cb input{flex:1;height:100%;border:0;padding:0 10px;background:none;min-width:0}
.cb .hint{padding:0 12px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted-3);white-space:nowrap}

/* grid */
.main{flex:1;min-height:0;overflow:auto;background:#fff;outline:none;position:relative}
table.grid{border-collapse:separate;border-spacing:0;min-width:100%}
.grid th{position:sticky;top:0;z-index:3;height:28px;padding:0 8px;background:var(--label-bg);border-bottom:1px solid var(--frame);border-right:1px solid var(--rule);text-align:left;font-family:var(--font-mono);font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;user-select:none}
.grid th:first-child{left:0;z-index:5}
.grid th .hm{float:right;border:0;background:none;color:var(--muted-3);cursor:pointer;padding:0 0 0 6px;visibility:hidden}
.grid th:hover .hm{visibility:visible}
.grid th.dropL{box-shadow:inset 3px 0 0 var(--mark)} .grid th.dropR{box-shadow:inset -3px 0 0 var(--mark)}
.grid th.virt{color:var(--muted-3)}
.grid td{height:28px;padding:0 8px;border-bottom:1px solid var(--rule-2);border-right:1px solid var(--rule-3);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis;cursor:cell;background:#fff}
.grid td:first-child{position:sticky;left:0;z-index:2;max-width:none;border-right:1px solid var(--frame);min-width:300px}
.grid tr.d0 td{background:var(--band-2);font-weight:600;color:var(--ink)}
.grid tr.d1 td{font-weight:500}
.grid tr.dim td{color:var(--muted-3);background:#f6f8fa;font-weight:400}
.grid tr.dim .chip{opacity:.55} .grid tr.dim a{color:var(--muted-3)}
.grid td.sel{outline:2px solid var(--mark);outline-offset:-2px;z-index:1;position:relative}
.grid td:first-child.sel{position:sticky;z-index:2}
.grid td.num{text-align:right;font-family:var(--font-mono);font-size:12px}
.grid td.sum{color:var(--muted)}
.grid td.ok2{background:#e7f4f1!important}
.grid td.ctr{text-align:center}
.grid tr.dropT td{box-shadow:inset 0 2px 0 var(--mark)} .grid tr.dropB td{box-shadow:inset 0 -2px 0 var(--mark)} .grid tr.dropIn td{box-shadow:inset 0 0 0 2px var(--mark)}
.grid tr.hit td:first-child{box-shadow:inset 3px 0 0 #e0a800}
.tc{display:flex;align-items:center;gap:5px;height:100%}
.grip{flex:none;width:10px;color:var(--muted-3);cursor:grab;font-size:10px;visibility:hidden;line-height:1}
tr:hover .grip{visibility:visible}
.caret{flex:none;width:14px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:9px;padding:0}
.caret.leaf{visibility:hidden}
.lvl{flex:none;font-family:var(--font-mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);border:1px solid var(--rule);border-radius:2px;padding:1px 3px;background:#fff;font-weight:400}
.ttl{overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11.5px;font-weight:500;line-height:16px;color:var(--c,#5980a6);background:color-mix(in srgb,var(--c,#5980a6) 13%,#fff);border:1px solid color-mix(in srgb,var(--c,#5980a6) 30%,#fff)}
.box{display:inline-block;width:14px;height:14px;border:1.5px solid var(--rule);border-radius:2px;vertical-align:middle;position:relative;background:#fff}
tr:hover .box,td.sel .box{border-color:var(--frame)}
.box.on,tr:hover .box.on{background:var(--teal);border-color:var(--teal)}
.prog{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.prog i{display:block;width:44px;height:5px;border-radius:3px;background:var(--rule);overflow:hidden}
.prog i b{display:block;height:100%;background:var(--teal)}
.fbtn.on{background:#e3eefa;border-color:#b9d3ee;color:var(--ink)}
.wl td.h{text-align:center;font-family:var(--font-mono);font-size:11px;padding:0;min-width:26px;width:26px;cursor:default}
.wl td.we,.wl th.we{background:#eef1f5!important;color:var(--muted-3)}
.wl td.full{background:#d9ebf8} .wl td.part{background:#eef6fc} .wl td.free{color:var(--muted-3)}
.wl th.d{padding:0;text-align:center;min-width:26px;width:26px;line-height:1.2;height:40px;letter-spacing:0}
.box.on::after{content:"";position:absolute;left:3.5px;top:.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.over{color:var(--danger);font-weight:600}.under{color:var(--teal)}
.edit{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0 8px;font:inherit;background:#fff;outline:2px solid var(--mark);outline-offset:-2px}
td.editing{position:relative;padding:0!important;overflow:visible}
td:first-child.editing{position:sticky}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* status bar + sheet tabs */
.stat{flex:none;display:flex;align-items:center;height:26px;background:var(--label-bg);border-top:1px solid var(--frame);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat div{padding:0 14px;border-right:1px solid var(--rule);white-space:nowrap}
.stat b{font-size:12px;color:var(--ink);letter-spacing:0;margin-left:5px}
.tabs{flex:none;display:flex;align-items:stretch;height:32px;background:var(--band);border-top:1px solid var(--frame);padding-left:8px}
.tab{display:flex;align-items:center;padding:0 16px;border:0;border-right:1px solid var(--frame);background:none;font-family:var(--font-heading);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tab:first-of-type{border-left:1px solid var(--frame)}
.tab:hover{background:var(--band-2);color:var(--ink)}
.tab[aria-current=page]{background:#fff;color:var(--ink);box-shadow:inset 0 -3px 0 #7fd4d2;margin-top:-1px}
.tabs .soon{display:flex;align-items:center;padding:0 12px;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-3);white-space:nowrap}

/* menu, modal, toast */
.menu{position:fixed;z-index:60;min-width:190px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--frame);border-radius:4px;box-shadow:0 12px 32px rgba(23,50,77,.18);padding:4px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:6px 10px;border-radius:3px;cursor:pointer;font-size:12.5px}
.menu button:hover,.menu button:focus{background:var(--band-2);outline:none}
.menu button.danger{color:var(--danger)} .menu button:disabled{color:var(--muted-3);cursor:default;background:none}
.menu hr{border:0;border-top:1px solid var(--rule);margin:4px 0}
.menu .mh{padding:4px 10px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-3)}
.menu form{padding:8px;display:flex;flex-direction:column;gap:6px;width:260px}
.menu form input{height:28px;border:1px solid var(--frame);border-radius:3px;padding:0 8px}
.veil{position:fixed;inset:0;z-index:50;background:rgba(23,50,77,.32);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{position:relative;width:min(720px,100%);max-height:86vh;display:flex;flex-direction:column;background:#fff;border:1px solid var(--frame)}
.modal::before,.modal::after{content:"+";position:absolute;font-family:var(--font-mono);font-size:11px;line-height:1;color:var(--mark)}
.modal::before{left:-4px;top:-6px}.modal::after{right:-4px;top:-6px}
.mhead{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;background:var(--band);border-bottom:1px solid var(--frame)}
.mhead .t{font-family:var(--font-heading);font-size:16px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.mhead .sp{flex:1}
.mtabs{display:flex;gap:2px;padding:8px 14px 0;border-bottom:1px solid var(--rule)}
.mtabs button{border:0;background:none;padding:6px 12px;font-family:var(--font-heading);font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.mtabs button.on{color:var(--ink);border-bottom-color:#7fd4d2}
.mbody{padding:14px;overflow:auto}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--rule);background:var(--soft)}
.orow{display:flex;align-items:center;gap:6px;padding:3px 0}
.orow input[type=text]{flex:1;height:28px;border:1px solid var(--rule);border-radius:3px;padding:0 8px}
.orow input[type=color]{width:30px;height:28px;border:1px solid var(--rule);border-radius:3px;padding:1px;background:#fff}
.orow label{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
.orow .n{width:20px;text-align:right;font-family:var(--font-mono);font-size:10.5px;color:var(--muted-3)}
.ib{width:26px;height:26px;border:1px solid var(--rule);background:#fff;border-radius:3px;cursor:pointer;color:var(--muted)}
.ib:hover{background:var(--band-2);color:var(--ink)} .ib:disabled{opacity:.35;cursor:default}
.note{font-size:11.5px;color:var(--muted);line-height:1.5;margin:10px 0 0}
.note b{color:var(--text-2)}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);max-width:min(560px,92vw);background:var(--ink);color:#fff;padding:9px 14px;border-radius:3px;font-size:12.5px;z-index:70;box-shadow:0 12px 32px rgba(23,50,77,.25)}
.toast.bad{background:var(--danger)}

/* plain sheets (pipelines, history) */
.pad{padding:18px 20px 40px;display:flex;flex-direction:column;gap:14px}
.panel{position:relative;background:#fff;border:1px solid var(--frame)}
.bar{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;background:var(--band);border-bottom:1px solid var(--frame)}
.bar .t{font-family:var(--font-heading);font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.bar .n{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)} .bar .sp{flex:1}
table.plain{border-collapse:collapse;width:100%}
.plain th{height:28px;padding:0 9px;background:var(--label-bg);border-bottom:1px solid var(--frame);text-align:left;font-family:var(--font-mono);font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.plain td{height:30px;padding:0 9px;border-bottom:1px solid var(--rule-2)}
.plain input,.plain select{height:26px;border:1px solid transparent;background:none;padding:0 6px;width:100%;border-radius:3px}
.plain input:hover,.plain select:hover{border-color:var(--rule)} .plain input:focus,.plain select:focus{outline:2px solid var(--mark);background:#fff}
.dchips{display:flex;flex-wrap:wrap;gap:4px}
.dchip{border:1px solid var(--rule);background:#fff;border-radius:3px;padding:1px 7px;font-size:11.5px;color:var(--muted);cursor:pointer}
.dchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:var(--soft)}
.form input{height:26px;border:1px solid var(--frame);border-radius:3px;padding:0 7px}
.form label{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tag{display:inline-block;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;padding:2px 6px;border-radius:2px;background:var(--band);color:var(--ink-2);white-space:nowrap}
.tag.warn{background:#f6ecd4;color:var(--honey)} .tag.off{background:var(--rule-3);color:var(--muted-3)}

/* gantt */
.gwrap{display:grid;min-width:max-content}
.gh{position:sticky;top:0;z-index:4;display:flex;background:var(--label-bg);border-bottom:1px solid var(--frame)}
.gname{position:sticky;left:0;z-index:3;flex:none;width:330px;background:#fff;border-right:1px solid var(--frame);display:flex;align-items:center;gap:6px;padding:0 8px;height:26px;overflow:hidden;white-space:nowrap}
.gh .gname{background:var(--label-bg);z-index:6;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);height:40px}
.gdays{display:flex}
.gd{flex:none;width:26px;height:40px;border-right:1px solid var(--rule-3);font-family:var(--font-mono);font-size:9.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.gd.we{background:#e9edf3;color:var(--muted-3)} .gd.mo{border-left:1px solid var(--frame)}
.gr{display:flex;border-bottom:1px solid var(--rule-2)}
.gr.d0 .gname{background:var(--band-2);font-weight:600;color:var(--ink)} .gr.d0 .gtrack{background-color:var(--band-2)}
.gtrack{position:relative;height:26px;flex:none;background-image:linear-gradient(to right,transparent 25px,var(--rule-3) 25px);background-size:26px 100%}
.gwe{position:absolute;top:0;bottom:0;width:26px;background:rgba(160,172,190,.2)}
.gbar{position:absolute;top:5px;height:16px;border-radius:3px;background:var(--c,#5980a6);color:#fff;font-size:10px;line-height:16px;padding:0 5px;overflow:hidden;white-space:nowrap}
.gbar.span{top:10px;height:6px;background:var(--ink);opacity:.55;padding:0}
.gbar.gap{background:repeating-linear-gradient(135deg,#c9b06a 0 4px,#efe2b6 4px 8px);color:#5d4708}
.gdone{position:absolute;left:6px;top:5px;font-family:var(--font-mono);font-size:10px;color:var(--muted-3)}
.glegend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:0 12px;font-size:11.5px;color:var(--muted)}
.glegend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* login */
.login{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.login form{position:relative;width:340px;padding:26px 24px 22px;display:flex;flex-direction:column;gap:12px;background:#fff;border:1px solid var(--frame)}
.login h1{margin:6px 0 0;font-family:var(--font-heading);font-size:34px;line-height:.9;font-weight:600;text-transform:uppercase;color:var(--ink)}
.kicker{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2)}
.login input{height:32px;border:1px solid var(--frame);border-radius:2px;padding:0 9px;width:100%}
.login label{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.err{color:var(--danger);font-size:12px;min-height:16px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const SUPABASE_URL = "https://tdoqodyvsgaeovtfpdqk.supabase.co";
const SUPABASE_KEY = "sb_publishable_M4SQKwJ3wq-dsTFxTm9OKw_-jTTmQnI";   // publishable key: safe in the browser, data is guarded by row-level security
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const S = { user:null, projects:[], project:null, tbl:null, view:null, levels:[], fields:[], members:[], pipelines:[], stages:[], deps:[],
  tree:[], row:{}, batches:[], recdeps:[], gaps:[], sheet:"tracker", collapsed:new Set(), sel:null, editing:false, search:"", saving:0, drag:null, fStatus:new Set(), fPerson:new Set() };

/* ---------------- small helpers ---------------- */
let toastTimer;
function toast(msg, bad){ document.querySelectorAll(".toast").forEach(e => e.remove()); const d = document.createElement("div"); d.className = "toast" + (bad ? " bad" : ""); d.textContent = msg; document.body.appendChild(d); clearTimeout(toastTimer); toastTimer = setTimeout(() => d.remove(), bad ? 6000 : 2400); }
function fail(e){ console.error(e); toast(e?.message || String(e), true); }
async function q(p){ const { data, error } = await p; if (error) throw error; return data; }
const num = v => v == null || v === "" ? "" : String(+(+v).toFixed(2));
const byRole = r => S.fields.find(f => f.role === r);
const enabledLevels = () => S.levels.filter(l => l.enabled);
const levelOf = r => S.levels.find(l => l.name === r.level);
function childLevel(r){ const cur = levelOf(r); return cur ? enabledLevels().find(l => l.position > cur.position) : null; }
const meta = (f, v) => (f?.config?.meta && f.config.meta[v]) || {};
const memberName = id => S.members.find(m => m.id === id)?.display_name || "";
function closeMenu(){ document.querySelectorAll(".menu").forEach(e => e.remove()); }
function closeModal(){ document.querySelectorAll(".veil").forEach(e => e.remove()); }

/* run a change: show "Saving…", reload what changed, re-render */
async function act(fn, { schema = false, ok = null } = {}){
  S.saving++; paintSaved();
  try { await fn(); if (schema) await loadProject(); else await loadTree(); if (ok) toast(ok); }
  catch (e) { fail(e); try { await loadProject(); } catch (_) {} }
  finally { S.saving--; }
  render();
}
function paintSaved(){ const el = document.querySelector(".saved"); if (el) { el.textContent = S.saving ? "Saving…" : "All changes saved"; el.classList.toggle("busy", !!S.saving); } }

/* ---------------- auth ---------------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  S.user = session?.user || null;

async function loadProject(){

  S.view = (await q(sb.from("view").select("*").eq("table_id", S.tbl.id).eq("kind", "grid").is("deleted_at", null).order("position")))[0];
  const [levels, fields, vf, members, pipelines] = await Promise.all([
    q(sb.from("tree_level").select("*").eq("table_id", S.tbl.id).order("position")),
    q(sb.from("field").select("*").eq("table_id", S.tbl.id).is("deleted_at", null).order("position")),
    q(sb.from("view_field").select("*").eq("view_id", S.view.id).order("position")),
    q(sb.from("project_member").select("id,display_name,access_role").eq("project_id", p.id).is("removed_at", null).order("display_name")),
    q(sb.from("pipeline").select("*").eq("project_id", p.id).is("archived_at", null).order("position").order("name")),

  S.fields = fields.filter(f => (vfm[f.id]?.mode || "edit") !== "hidden").map(f => ({ ...f, mode: vfm[f.id]?.mode || "edit", vpos: vfm[f.id]?.position ?? 999 }))

  const ids = pipelines.map(x => x.id);

  const sids = S.stages.map(s => s.id);

async function loadTree(){
  S.tree = await q(sb.rpc("get_tree", { p_table: S.tbl.id }));

  // estimate of only those work items that already have time logged: the fair base for "% over"
  for (const r of S.tree) { r.est_tracked = 0; r.n_leaf = 0; r.n_done = 0; }
  for (const r of S.tree) if (r.is_leaf && r.parent_id) { const d = isDone(r); let x = S.row[r.parent_id]; while (x) { x.n_leaf++; if (d) x.n_done++; x = S.row[x.parent_id]; } }

    const who = (asg && r.data?.[asg.id]) || "none:" + r.id; let start = free[who] || 0;

      <span class="hint">${lastEnd ? "last stage ends " + fmt(lastEnd - 0.01) : ""}</span></div>
    <div class="main" tabindex="0"><div class="gwrap"><div class="gh"><div class="gname">Asset / stage</div><div class="gdays">${cal.map(c => `<div class="gd ${c.we ? "we" : ""} ${c.date.getDay() === 1 ? "mo" : ""}"><span>${"SMTWTFS"[c.date.getDay()]}</span><span>${c.date.getDate()}</span></div>`).join("")}</div></div>${body || `<div class="empty">No rows yet.</div>`}</div></div>
    <div class="stat"><div>Stages to do<b>${live.length}</b></div><div>Finished<b>${Object.values(plan).filter(p => p.done).length}</b></div><div>Hours left<b>${num(live.reduce((a, p) => a + p.end - p.start, 0))} h</b></div><div style="border:0">Dates are not stored yet · no vacations or holidays · dragging bars and autoplanning come next</div></div>`;
}

/* ---------------- pipelines ---------------- */
function sheetPipelines(){
  const gaps = [["","None"],["client_review","Client review"],["internal_review","Internal review"],["pending","Pending"]];
  let h = `<div class="main"><div class="pad">`;
  for (const p of S.pipelines) { const st = S.stages.filter(s => s.pipeline_id === p.id);
    h += `<div class="panel"><div class="bar"><span class="t">${esc(p.name)}</span><span class="n">${st.length} stages · ${st.reduce((a, s) => a + (+s.default_hours || 0), 0)} h</span></div>
    <table class="plain"><thead><tr><th style="width:36px">#</th><th>Stage</th><th style="width:110px">Default, h</th><th style="width:170px">After the stage</th><th>Can start after</th></tr></thead><tbody>
    ${st.map((s, i) => `<tr><td>${i + 1}</td><td><input data-ps="${s.id}" data-k="name" value="${esc(s.name)}"></td>
      <td><input type="number" min="0" step="0.5" data-ps="${s.id}" data-k="default_hours" value="${s.default_hours ?? ""}"></td>
      <td><select data-ps="${s.id}" data-k="gap_type">${gaps.map(([v, n]) => `<option value="${v}" ${(s.gap_type || "") === v ? "selected" : ""}>${n}</option>`).join("")}</select></td>
      <td><div class="dchips">${st.filter(o => o.id !== s.id).map(o => `<button class="dchip ${S.deps.some(d => d.stage_id === s.id && d.depends_on_id === o.id) ? "on" : ""}" data-act="dep" data-s="${s.id}" data-o="${o.id}">${esc(o.name)}</button>`).join("") || "—"}</div></td></tr>`).join("")}
    </tbody></table><form class="form" data-form="stage" data-pl="${p.id}"><label>New stage</label><input name="name" placeholder="Name" required autocomplete="off"><input name="hours" type="number" min="0" step="0.5" placeholder="Hours" style="width:90px"><button class="tbtn" type="submit">+ Stage</button></form></div>`; }
  h += `<div class="panel"><form class="form" data-form="pipeline"><label>New pipeline</label><input name="name" placeholder="Name, e.g. Characters" required autocomplete="off" style="width:260px"><button class="tbtn pri" type="submit">+ Pipeline</button></form></div>
    <p class="note" style="max-width:900px"><b>How it works.</b> A stage with nothing selected can start at any time. Textures after Bakes and LODs after Low poly means the two can run in parallel. Changing a pipeline affects only assets created afterwards. A circular dependency is rejected by the database.</p></div></div>`;
  return h;
}

/* ---------------- history ---------------- */
function sheetHistory(){
  const kinds = { edit:"Edit", schema:"Structure", pipeline:"Pipeline", revert:"Undo", split:"Split", import:"Import", auto_shift:"Auto shift", draft_apply:"Plan" };
  return `<div class="tb"><button class="tbtn" data-act="reloadhistory">Refresh</button><span class="sp"></span><span class="tag">Every change is recorded · nothing is erased</span></div>
  <div class="main"><table class="plain"><thead><tr><th style="width:160px">When</th><th style="width:100px">Kind</th><th>What</th><th style="width:80px">Lines</th><th style="width:120px"></th></tr></thead><tbody>
  ${S.batches.map(b => `<tr><td style="font-family:var(--font-mono);font-size:11.5px;color:var(--muted)">${new Date(b.created_at).toLocaleString("en-GB", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit", second:"2-digit" })}</td>
    <td><span class="tag ${b.kind === "revert" ? "warn" : ""}">${kinds[b.kind] || b.kind}</span></td><td>${esc(b.summary || "")}</td><td>${b.change_log?.[0]?.count ?? ""}</td>
    <td>${b.reverted_by ? `<span class="tag off">undone</span>` : b.kind === "revert" ? "" : `<button class="tbtn" data-act="revert" data-id="${b.id}">Undo this</button>`}</td></tr>`).join("") || `<tr><td colspan="5"><div class="empty">No changes yet.</div></td></tr>`}
  </tbody></table></div>`;
}

/* ---------------- events ---------------- */
document.addEventListener("mousedown", e => { if (!e.target.closest(".menu")) closeMenu(); });
$app.addEventListener("click", async e => {
  const t = e.target; const b = t.closest("[data-sheet],[data-act]");
  if (b?.dataset.sheet) { S.sheet = b.dataset.sheet; S.editing = false; closeMenu();
    try { if (S.sheet === "history") await loadHistory(); if (S.sheet === "gantt" || S.sheet === "workload") await loadPlanData(); } catch (err) { fail(err); } return render(); }
  if (b) { const a = b.dataset.act, id = b.dataset.id;
    if (a === "out") return sb.auth.signOut();
    if (a === "pwd") { const p = window.prompt("New password (at least 8 characters):"); if (!p) return; if (p.length < 8) return toast("Too short", true); const { error } = await sb.auth.updateUser({ password: p }); return error ? fail(error) : toast("Password changed"); }
    if (a === "toggle") { S.collapsed.has(id) ? S.collapsed.delete(id) : S.collapsed.add(id); return render(); }
    if (a === "collapse") { S.tree.filter(r => r.depth >= 1 && !r.is_leaf).forEach(r => S.collapsed.add(r.id)); return render(); }
    if (a === "expand") { S.collapsed.clear(); return render(); }
    if (a === "undo") return undo();
    if (a === "fclear") { S.fStatus.clear(); S.fPerson.clear(); S.search = ""; return render(); }
    if (a === "fstatus" || a === "fperson") { const set = a === "fstatus" ? S.fStatus : S.fPerson; const st = byRole("status"); const box = b.getBoundingClientRect();
      const opts = a === "fstatus" ? (st?.config?.options || []).map(o => ({ v:o, html:`<span class="chip" style="--c:${esc(meta(st, o).color || "#5980a6")}">${esc(o)}</span>` })) : S.members.map(m => ({ v:m.id, html: esc(m.display_name) }));
      const open = () => openMenu(box.left, box.bottom + 2, [...opts.map(o => ({ html: `<span class="box ${set.has(o.v) ? "on" : ""}"></span> ` + o.html, run: () => { set.has(o.v) ? set.delete(o.v) : set.add(o.v); render(); open(); } })), "-", { label:"Show all", run: () => { set.clear(); render(); } }]);
      return open(); }
    if (a === "addroot") return addRow(null, enabledLevels()[0], null);
    if (a === "addrow") { const r = S.row[S.sel?.r]; return r && addRow(r.parent_id, levelOf(r), nextSibling(r)?.id || null); }
    if (a === "addchild") { const r = S.row[S.sel?.r]; return r && addRow(r.id, childLevel(r), null); }
    if (a === "addfield") return addField();
    if (a === "settings") return openSettings();
    if (a === "colmenu") { const r = b.getBoundingClientRect(); return colMenu(S.fields.find(f => f.id === b.dataset.f), r.left, r.bottom + 2); }
    if (a === "dep") return act(async () => { if (b.classList.contains("on")) await q(sb.from("pipeline_stage_dep").delete().eq("stage_id", b.dataset.s).eq("depends_on_id", b.dataset.o));
      else await q(sb.from("pipeline_stage_dep").insert({ org_id: S.project.org_id, stage_id: b.dataset.s, depends_on_id: b.dataset.o })); }, { schema:true });
    if (a === "reloadhistory") { try { await loadHistory(); } catch (err) { fail(err); } return render(); }
    if (a === "revert") return act(async () => { await q(sb.rpc("revert_batch", { p_batch: id })); await loadHistory(); }, { schema:true, ok:"Undone" });
  }
  if (S.sheet !== "tracker") return;
  const td = t.closest("td[data-f]"); const tr = t.closest("tr[data-id]");
  if (td && tr && !t.closest("a")) { const same = S.sel && S.sel.r === tr.dataset.id && S.sel.f === td.dataset.f; const f = columns().find(x => x.id === td.dataset.f);
    if (S.editing && same) return; S.sel = { r: tr.dataset.id, f: td.dataset.f }; S.editing = false; render();
    if (f && (f.type === "checkbox" || (same && ["select","person","link"].includes(f.type)))) startEdit(); }
});
$app.addEventListener("dblclick", e => { if (S.sheet === "tracker" && e.target.closest("td[data-f]") && !S.editing) startEdit(); });
$app.addEventListener("contextmenu", e => { if (S.sheet !== "tracker") return; const tr = e.target.closest("tr[data-id]"); const th = e.target.closest("th[data-f]");
  if (tr) { e.preventDefault(); const td = e.target.closest("td[data-f]"); S.sel = { r: tr.dataset.id, f: td?.dataset.f || S.fields[0].id }; render(); return rowMenu(S.row[tr.dataset.id], e.clientX, e.clientY); }
  if (th) { const f = S.fields.find(x => x.id === th.dataset.f); if (f) { e.preventDefault(); colMenu(f, e.clientX, e.clientY); } } });
$app.addEventListener("keydown", e => {
  if (e.target.id === "cellbar") { e.stopPropagation();
    if (e.key === "Enter" && S.sel && !e.target.readOnly) { e.preventDefault(); const r = S.row[S.sel.r], f = columns().find(x => x.id === S.sel.f); let v = e.target.value.trim();
      if (["number","money","duration"].includes(f.type)) { v = v === "" ? null : Number(v.replace(",", ".")); if (Number.isNaN(v)) return toast("This cell needs a number", true); } else if (v === "") v = null; e.target.blur(); return setCell(r.id, f, v); }
    if (e.key === "Escape") { e.target.blur(); render(); } return; }
  if (S.sheet !== "tracker" || S.editing || !e.target.classList.contains("main")) return; const k = e.key;
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === "z") { e.preventDefault(); return undo(); }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (k === "ArrowDown") { e.preventDefault(); return moveSel(1, 0); } if (k === "ArrowUp") { e.preventDefault(); return moveSel(-1, 0); }
  if (k === "ArrowRight") { e.preventDefault(); return moveSel(0, 1); } if (k === "ArrowLeft") { e.preventDefault(); return moveSel(0, -1); }
  if (k === "Tab") { e.preventDefault(); return moveSel(0, e.shiftKey ? -1 : 1); }
  if (!S.sel) return;
  if (k === "Enter" || k === "F2") { e.preventDefault(); return startEdit(); }
  if (k === " ") { const f = columns().find(x => x.id === S.sel.f); if (f?.type === "checkbox") { e.preventDefault(); return startEdit(); } }
  if (k === "Delete" || k === "Backspace") { const r = S.row[S.sel.r], f = columns().find(x => x.id === S.sel.f); e.preventDefault();
    if (!r || !f || f.virtual || isRollup(r, f) || f.role === "title") return; return setCell(r.id, f, f.type === "checkbox" ? false : null); }
  if (k.length === 1) { const f = columns().find(x => x.id === S.sel.f); if (f && !f.virtual && ["text","number","money","duration"].includes(f.type)) { e.preventDefault(); return startEdit(k); } }
});
$app.addEventListener("input", e => { if (e.target.id === "search") { S.search = e.target.value; const pos = e.target.selectionStart; render(); const s = document.getElementById("search"); s.focus(); s.setSelectionRange(pos, pos); } });
$app.addEventListener("change", e => { const el = e.target;
  if (el.id === "proj") { S.project = S.projects.find(p => p.id === el.value); S.collapsed.clear(); S.sel = null; return act(async () => { if (S.sheet === "history") await loadHistory(); }, { schema:true }); }
  if (el.dataset.ps) return act(async () => { const k = el.dataset.k; let v = el.value; if (k === "default_hours") v = v === "" ? null : Number(v); if (k === "gap_type") v = v || null; if (k === "name" && !v) throw new Error("Stage name cannot be empty");
    await q(sb.from("pipeline_stage").update({ [k]: v }).eq("id", el.dataset.ps)); }, { schema:true }); });
$app.addEventListener("submit", e => { const f = e.target; if (f.id === "lf") return; e.preventDefault();
  if (f.dataset.form === "pipeline") { const name = f.elements.name.value.trim(); return act(() => q(sb.from("pipeline").insert({ org_id: S.project.org_id, project_id: S.project.id, name })), { schema:true, ok:"Pipeline created" }); }
  if (f.dataset.form === "stage") { const pl = f.dataset.pl; const st = S.stages.filter(s => s.pipeline_id === pl); const name = f.elements.name.value.trim(); const hours = f.elements.hours.value;
    return act(async () => { const pos = st.length ? Math.max(...st.map(s => s.position)) + 1 : 1;
      const row = (await q(sb.from("pipeline_stage").insert({ org_id: S.project.org_id, pipeline_id: pl, name, position: pos, default_hours: hours === "" ? null : Number(hours) }).select()))[0];
      if (st.length) await q(sb.from("pipeline_stage_dep").insert({ org_id: S.project.org_id, stage_id: row.id, depends_on_id: st[st.length - 1].id })); }, { schema:true, ok:"Stage added" }); } });

/* drag rows and columns */
const clearDrop = () => document.querySelectorAll(".dropT,.dropB,.dropIn,.dropL,.dropR").forEach(x => x.classList.remove("dropT", "dropB", "dropIn", "dropL", "dropR"));
$app.addEventListener("dragstart", e => { const g = e.target.closest?.(".grip"); const th = e.target.closest?.("th[data-f]");
  if (g) { const tr = g.closest("tr"); S.drag = { kind:"row", id: tr.dataset.id }; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", tr.dataset.id); try { e.dataTransfer.setDragImage(tr, 20, 14); } catch (_) {} }
  else if (th) { S.drag = { kind:"col", id: th.dataset.f }; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", th.dataset.f); } });
function dropTarget(e){ if (!S.drag) return null;
  if (S.drag.kind === "row") { const tr = e.target.closest("tr[data-id]"); if (!tr) return null; const src = S.row[S.drag.id], dst = S.row[tr.dataset.id]; if (!src || !dst || src.id === dst.id) return null;
    if (src.level === dst.level) { const b = tr.getBoundingClientRect(); return { tr, where: e.clientY < b.top + b.height / 2 ? "T" : "B", src, dst }; }
    if (S.row[src.parent_id]?.level === dst.level && dst.id !== src.parent_id) return { tr, where:"In", src, dst }; return null; }
  const th = e.target.closest("th[data-f]"); if (!th || th.dataset.f === S.drag.id) return null; const f = S.fields.find(x => x.id === th.dataset.f); if (!f || f.role === "title") return null;
  const b = th.getBoundingClientRect(); return { th, where: e.clientX < b.left + b.width / 2 ? "L" : "R", f }; }
$app.addEventListener("dragover", e => { const t = dropTarget(e); clearDrop(); if (!t) return; e.preventDefault(); e.dataTransfer.dropEffect = "move"; (t.tr || t.th).classList.add("drop" + t.where); });
$app.addEventListener("dragend", () => { S.drag = null; clearDrop(); });
$app.addEventListener("drop", e => { const t = dropTarget(e); const d = S.drag; S.drag = null; clearDrop(); if (!t) return; e.preventDefault();
  if (d.kind === "row") { const parent = t.where === "In" ? t.dst.id : t.dst.parent_id; const before = t.where === "T" ? t.dst.id : t.where === "B" ? (nextSibling(t.dst)?.id || null) : null;
    if (before === t.src.id) return; return act(() => q(sb.rpc("move_record", { p_record: t.src.id, p_parent: parent, p_before: before }))); }
  const i = S.fields.indexOf(t.f); const before = t.where === "L" ? t.f.id : (S.fields[i + 1]?.id || null); if (before === d.id) return;
  act(() => q(sb.rpc("move_field", { p_view: S.view.id, p_field: d.id, p_before: before })), { schema:true }); });
boot();
</script>
</body>
