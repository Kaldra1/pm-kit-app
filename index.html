<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM-Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* PM-сетап look, spreadsheet layout: header, toolbar, cell bar, grid, status bar, sheet tabs at the bottom */
:root{
  --font-heading:"Barlow Condensed",system-ui,sans-serif; --font-body:"Barlow",system-ui,sans-serif; --font-mono:ui-monospace,Menlo,Consolas,monospace;
  --ink:#17324d; --ink-2:#1d4467; --text:#23303f; --text-2:#3f4a5c; --muted:#6b7689; --muted-2:#7b879a; --muted-3:#9aa6b6;
  --page:#eef2f8; --frame:#b8c3d4; --rule:#dfe6ef; --rule-2:#e6ebf2; --rule-3:#eef2f7; --band:#e4ebf4; --band-2:#eff3f8;
  --font-table:"Inter",system-ui,sans-serif; --fs:13px;
  --label-bg:#f2f5f9; --soft:#f7f9fc; --mark:#3d86c6; --honey:#8a6410; --teal:#10635f; --danger:#a8432f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--page);overflow:hidden}
body{font-family:var(--font-body);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:#2c5f8f;text-underline-offset:2px}
[hidden]{display:none!important}
::selection{background:#c5dff7}
#app{height:100%;display:flex;flex-direction:column}

/* header */
.hdr{flex:none;display:flex;align-items:center;gap:12px;height:40px;padding:0 14px;background:var(--ink);color:#dce6f2}
.brand{font-family:var(--font-heading);font-size:14px;font-weight:600;letter-spacing:.22em;color:#fff;padding-right:12px;border-right:1px solid #2f4b6b}
.hdr select{height:26px;background:#1d3d5c;color:#fff;border:1px solid #2f4b6b;border-radius:2px;padding:0 6px;font-weight:600}
.saved{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#8fa6c2}
.saved.busy{color:#f3d489}
.hdr .sp{flex:1}
.hdr .who{font-family:var(--font-mono);font-size:10.5px;color:#8fa6c2}
.hbtn{border:1px solid #2f4b6b;background:none;color:#dce6f2;border-radius:2px;height:24px;padding:0 8px;font-family:var(--font-heading);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.hbtn:hover{background:#1d3d5c}

/* menu row */
.mrow{flex:none;display:flex;align-items:center;gap:2px;height:26px;padding:0 8px;background:#fff;border-bottom:1px solid var(--rule-3)}
.mrow button{height:22px;padding:0 9px;border:0;background:none;border-radius:3px;font-size:12.5px;color:var(--text-2);cursor:pointer}
.mrow button:hover,.mrow button.open{background:var(--band-2);color:var(--ink)}
.menu button .hint{margin-left:auto;padding-left:18px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted-3)}
.tbtn.ico{padding:0 7px;font-size:14px;letter-spacing:0}
.split{display:inline-flex}.split .tbtn:first-child{border-radius:3px 0 0 3px;padding-right:6px}.split .tbtn:last-child{border-radius:0 3px 3px 0;padding:0 5px}
.grid tr.del td{text-decoration:line-through;color:var(--muted-3)!important;background:#fbf1ef!important}
.grid tr.del .chip{opacity:.4}
.grid tr.mv td:first-child{box-shadow:inset 3px 0 0 #e0a800}
.grid tr.nw td{background:#fbf6e6}.grid tr.nw td:first-child{box-shadow:inset 3px 0 0 #e0a800}
.grid th.fdr{box-shadow:inset 0 -2px 0 #e0a800;background:#fff8e6}
/* toolbar + cell bar */
.tb{flex:none;display:flex;align-items:center;gap:4px;height:38px;padding:0 10px;background:#fff;border-bottom:1px solid var(--rule)}
.tbtn{height:26px;padding:0 9px;border:1px solid transparent;background:none;border-radius:3px;font-family:var(--font-heading);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--band-2);border-color:var(--rule)}
.tbtn.pri{background:var(--ink);color:#fff}.tbtn.pri:hover{background:var(--ink-2)}
.tbtn:disabled{opacity:.4;cursor:default}
.tsep{width:1px;height:20px;background:var(--rule);margin:0 5px}
.tb .sp{flex:1}
.search{height:26px;width:200px;border:1px solid var(--rule);border-radius:3px;padding:0 8px;background:var(--soft)}
.search:focus,.cb input:focus{outline:2px solid var(--mark);outline-offset:-1px;background:#fff}
.cb{flex:none;display:flex;align-items:center;height:30px;background:#fff;border-bottom:1px solid var(--frame)}
.cb .ref{flex:none;width:300px;padding:0 12px;font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--rule)}
.cb input{flex:1;height:100%;border:0;padding:0 10px;background:none;min-width:0;font-family:var(--font-table)}
.cb .hint{padding:0 12px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted-3);white-space:nowrap}

/* grid */
.main{flex:1;min-height:0;overflow:auto;background:#fff;outline:none;position:relative}
.main>*{zoom:var(--zoom,1)}
table.grid{border-collapse:separate;border-spacing:0;min-width:100%}
.grid th{position:sticky;top:0;z-index:3;vertical-align:top;line-height:1.25;padding:calc(var(--fs) * .45) 8px;background:var(--label-bg);border-bottom:1px solid var(--frame);border-right:1px solid var(--rule);text-align:left;font-family:var(--font-table);font-size:calc(var(--fs) - 2px);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);white-space:nowrap;user-select:none}
.grid th:first-child{left:0;z-index:5}
.thc{display:flex;align-items:flex-start;gap:4px}
.thn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid th.wrap .thn{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:break-word}
.grid th .hm{flex:none;border:0;background:none;color:var(--muted-3);cursor:pointer;padding:0 2px;line-height:inherit;font-size:inherit;border-radius:2px}
.grid th:hover .hm,.grid th .hm:hover{color:var(--ink);background:var(--band)}
.grid th .hmk{flex:none;font-size:.82em;color:var(--mark)}
.grid th.flt{background:#e3eefa}
.grid td.dtc{white-space:nowrap;font-family:var(--font-mono);font-size:.92em}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2);white-space:nowrap;cursor:pointer}
.fnote{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:6px} .fnote b{color:var(--ink)}
.lnk{border:0;background:none;padding:0;color:var(--mark);cursor:pointer;font-size:12px;text-decoration:underline}
.fpop{min-width:230px;max-width:340px}
.fpop .fph{display:flex;gap:4px;padding:2px 6px 6px}.fpop .fph button{width:auto;flex:1;text-align:center;border:1px solid var(--rule);border-radius:3px;padding:3px 6px}
.fpop .fpl{max-height:320px;overflow:auto;border-top:1px solid var(--rule-2);padding:4px 0}
.fpop label{display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:12.5px;cursor:pointer}.fpop label:hover{background:var(--band)}
.fpop .fv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fpop .n{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-3)}
.modal.wide{width:min(980px,94vw)}
.sec{display:flex;align-items:center;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--frame)}.sec:first-child{margin-top:0}
.shd{margin-left:auto;display:grid;grid-template-columns:86px 86px 132px 250px;gap:8px;text-align:left}
.lvls{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.lvls .arr{color:var(--muted-3)}
.lvl{display:flex;align-items:center;gap:5px;border:1px solid var(--rule);border-radius:3px;padding:3px 7px;background:var(--label-bg);opacity:.75}.lvl.on{background:#fff;opacity:1;border-color:var(--frame)}
.lvl .ln{width:92px;height:24px;font:inherit;font-size:13px;color:var(--ink);border:1px solid transparent;background:none;padding:0 4px;border-radius:2px}.lvl .ln:hover{border-color:var(--rule)}.lvl .ln:focus{outline:2px solid var(--mark);background:#fff}
.lvl .n{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-3);min-width:14px;text-align:right}
.srow{display:grid;grid-template-columns:76px minmax(120px,1fr) 86px 86px 132px 170px 30px 30px;gap:8px;align-items:center;min-height:34px;border-bottom:1px solid var(--rule-2)}
.srow.del{opacity:.55}.srow.del .sn{text-decoration:line-through}.srow.del{grid-template-columns:76px minmax(120px,1fr) 86px 86px 132px 170px 68px}
.srow .slv{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-3);overflow:hidden;text-overflow:ellipsis}
.srow .sn,.srow .sdl{font:inherit;font-size:13px;color:var(--ink);height:26px;border:1px solid transparent;background:none;padding:0 6px;border-radius:3px;min-width:0;width:100%}.srow .sn{font-weight:600}
.srow .sn:hover,.srow .sdl:hover{border-color:var(--rule)}.srow .sn:focus,.srow .sdl:focus{outline:2px solid var(--mark);background:#fff}
.srow .sd{font-family:var(--font-mono);font-size:11.5px;color:var(--text-2)}.srow .sd.late{color:#b5483a;font-weight:600}.srow .sh{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sadd{padding:6px 0 8px}
.keyhelp{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:4px 26px}
.kcol .sec{margin-top:6px}.krow{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:12.5px;border-bottom:1px solid var(--rule-2)}
.kk{white-space:nowrap;color:var(--muted)}kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:1px 5px;background:var(--label-bg);color:var(--ink)}
.prefs{width:min(900px,94vw)}.pbody{display:flex;min-height:420px;overflow:hidden}.pnav{display:flex;flex-direction:column;gap:2px;padding:12px 8px;border-right:1px solid var(--rule);min-width:150px;background:var(--label-bg)}
.pnav button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:3px;cursor:pointer;font-size:13px;color:var(--text-2)}.pnav button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--mark)}
.pbody .mbody{flex:1;overflow:auto}.prow{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid var(--rule-2);font-size:13px}.prow>span:first-child{min-width:110px;color:var(--text-2)}
.prow input[type=password]{height:30px;border:1px solid var(--frame);border-radius:3px;padding:0 8px}.prow select{height:30px}
.chk2{align-items:flex-start;cursor:pointer}.chk2>span:first-child{min-width:0!important}
.hkbar{display:flex;gap:8px;margin-bottom:8px}.hkbar input{height:30px;border:1px solid var(--frame);border-radius:3px;padding:0 9px;width:280px}
table.hk td{vertical-align:middle}table.hk tr.rec td{background:#fff8e6}.recn{color:var(--honey);font-weight:600}
.grid th.dropL{box-shadow:inset 3px 0 0 var(--mark)} .grid th.dropR{box-shadow:inset -3px 0 0 var(--mark)}
.grid th.virt{color:var(--muted-3)}
.grid th{position:sticky}
.rz{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:6}
.rz:hover,.rz.on{background:var(--mark);opacity:.5}
.grid td{height:calc(var(--fs) * 2.15);font-family:var(--font-table);font-size:var(--fs);padding:0 8px;border-bottom:1px solid var(--rule-2);border-right:1px solid var(--rule-3);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis;cursor:cell;background:#fff}
.grid td:first-child{position:sticky;left:0;z-index:2;max-width:none;border-right:1px solid var(--frame);min-width:300px}
.grid tr.d0 td{background:var(--band-2);font-weight:600;color:var(--ink)}
.grid tr.d1 td{font-weight:500}
.grid tr.dim td{color:var(--muted-3);background:#f6f8fa;font-weight:400}
.grid tr.dim .chip{opacity:.55} .grid tr.dim a{color:var(--muted-3)}
.grid td.sel{outline:2px solid var(--mark);outline-offset:-2px;z-index:1;position:relative}
.grid tr.rsel td{background:#e6f0fa!important;box-shadow:inset 0 2px 0 var(--mark),inset 0 -2px 0 var(--mark)}.grid tr.rsel td:first-child{box-shadow:inset 3px 0 0 var(--mark),inset 0 2px 0 var(--mark),inset 0 -2px 0 var(--mark)}
.grid td:first-child.sel{position:sticky;z-index:2}
.grid td.num{text-align:right;font-variant-numeric:tabular-nums}
.grid td.sum{color:var(--muted)}
.grid td.ok2{background:#e7f4f1!important}
.grid td.ctr{text-align:center}
.grid tr.dropT td{box-shadow:inset 0 2px 0 var(--mark)} .grid tr.dropB td{box-shadow:inset 0 -2px 0 var(--mark)} .grid tr.dropIn td{box-shadow:inset 0 0 0 2px var(--mark)}
.grid tr.hit td:first-child{box-shadow:inset 3px 0 0 #e0a800}
.tc{display:flex;align-items:center;gap:5px;height:100%}
.grip{flex:none;width:10px;color:var(--muted-3);cursor:grab;font-size:10px;visibility:hidden;line-height:1}
tr:hover .grip{visibility:visible}
.caret{flex:none;width:14px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:9px;padding:0}
.caret.leaf{visibility:hidden}
.lvl{flex:none;font-family:var(--font-mono);font-size:calc(var(--fs) - 4.5px);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);border:1px solid var(--rule);border-radius:2px;padding:1px 3px;background:#fff;font-weight:400}
.ttl{overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;padding:1px 7px;border-radius:9px;font-size:calc(var(--fs) - 1.5px);font-weight:500;line-height:calc(var(--fs) + 3px);color:var(--c,#5980a6);background:color-mix(in srgb,var(--c,#5980a6) 13%,#fff);border:1px solid color-mix(in srgb,var(--c,#5980a6) 30%,#fff)}
.box{display:inline-block;width:14px;height:14px;border:1.5px solid var(--rule);border-radius:2px;vertical-align:middle;position:relative;background:#fff}
tr:hover .box,td.sel .box{border-color:var(--frame)}
.box.on,tr:hover .box.on{background:var(--teal);border-color:var(--teal)}
.prog{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.prog i{display:block;width:44px;height:5px;border-radius:3px;background:var(--rule);overflow:hidden}
.prog i b{display:block;height:100%;background:var(--teal)}
.fbtn.on{background:#e3eefa;border-color:#b9d3ee;color:var(--ink)}
.wl td.h{text-align:center;font-family:var(--font-mono);font-size:11px;padding:0;min-width:26px;width:26px;cursor:default}
.wl td.we,.wl th.we{background:#eef1f5!important;color:var(--muted-3)}
.wl td.full{background:#d9ebf8} .wl td.part{background:#eef6fc} .wl td.free{color:var(--muted-3)}
.wl th.d{padding:0;text-align:center;min-width:26px;width:26px;line-height:1.2;height:40px;letter-spacing:0}
.box.on::after{content:"";position:absolute;left:3.5px;top:.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.over{color:var(--danger);font-weight:600}.under{color:var(--teal)}
.edit{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0 8px;font:inherit;background:#fff;outline:2px solid var(--mark);outline-offset:-2px}
td.editing{position:relative;padding:0!important;overflow:visible}
td:first-child.editing{position:sticky}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* status bar + sheet tabs */
.stat{flex:none;display:flex;align-items:center;height:26px;background:var(--label-bg);border-top:1px solid var(--frame);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat div{padding:0 14px;border-right:1px solid var(--rule);white-space:nowrap}
.stat b{font-size:12px;color:var(--ink);letter-spacing:0;margin-left:5px}
.stat .sp{flex:1;border:0;padding:0}
.stat .vw{display:flex;align-items:center;gap:6px;border-right:0;border-left:1px solid var(--rule);text-transform:none;letter-spacing:0}
.stat .vw select{height:20px;border:1px solid var(--rule);border-radius:3px;background:#fff;font-size:11.5px;font-family:var(--font-body);padding:0 2px}
.stat .vw button{width:22px;height:20px;border:1px solid var(--rule);border-radius:3px;background:#fff;cursor:pointer;font-size:11px;line-height:1;color:var(--ink-2);padding:0}
.stat .vw button:hover{background:var(--band-2)}
.stat .vw input[type=range]{width:110px;accent-color:var(--ink-2)}
.stat .vw .val{min-width:38px;text-align:right;color:var(--ink);font-size:11.5px}
.tabs{flex:none;display:flex;align-items:stretch;height:32px;background:var(--band);border-top:1px solid var(--frame);padding-left:8px}
.tab{display:flex;align-items:center;padding:0 16px;border:0;border-right:1px solid var(--frame);background:none;font-family:var(--font-heading);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tab:first-of-type{border-left:1px solid var(--frame)}
.tab:hover{background:var(--band-2);color:var(--ink)}
.tab[aria-current=page]{background:#fff;color:var(--ink);box-shadow:inset 0 -3px 0 #7fd4d2;margin-top:-1px}
.tabs .soon{display:flex;align-items:center;padding:0 12px;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-3);white-space:nowrap}

/* menu, modal, toast */
.menu{position:fixed;z-index:60;min-width:190px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--frame);border-radius:4px;box-shadow:0 12px 32px rgba(23,50,77,.18);padding:4px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:6px 10px;border-radius:3px;cursor:pointer;font-size:12.5px}
.menu button:hover,.menu button:focus{background:var(--band-2);outline:none}
.menu button.danger{color:var(--danger)} .menu button:disabled{color:var(--muted-3);cursor:default;background:none}
.menu hr{border:0;border-top:1px solid var(--rule);margin:4px 0}
.menu .mh{padding:4px 10px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-3)}
.menu form{padding:8px;display:flex;flex-direction:column;gap:6px;width:260px}
.menu form input{height:28px;border:1px solid var(--frame);border-radius:3px;padding:0 8px}
.veil{position:fixed;inset:0;z-index:50;background:rgba(23,50,77,.32);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{position:relative;width:min(720px,100%);max-height:86vh;display:flex;flex-direction:column;background:#fff;border:1px solid var(--frame)}
.modal::before,.modal::after{content:"+";position:absolute;font-family:var(--font-mono);font-size:11px;line-height:1;color:var(--mark)}
.modal::before{left:-4px;top:-6px}.modal::after{right:-4px;top:-6px}
.mhead{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;background:var(--band);border-bottom:1px solid var(--frame)}
.mhead .t{font-family:var(--font-heading);font-size:16px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.mhead .sp{flex:1}
.mtabs{display:flex;gap:2px;padding:8px 14px 0;border-bottom:1px solid var(--rule)}
.mtabs button{border:0;background:none;padding:6px 12px;font-family:var(--font-heading);font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.mtabs button.on{color:var(--ink);border-bottom-color:#7fd4d2}
.mbody{padding:14px;overflow:auto}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--rule);background:var(--soft)}
.orow{display:flex;align-items:center;gap:6px;padding:3px 0}
.orow input[type=text]{flex:1;height:28px;border:1px solid var(--rule);border-radius:3px;padding:0 8px}
.orow input[type=color]{width:30px;height:28px;border:1px solid var(--rule);border-radius:3px;padding:1px;background:#fff}
.orow label{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}

/* run a change: show "Saving…", reload what changed, re-render */
async function act(fn, { schema = false, ok = null } = {}){
  S.saving++; paintSaved();

  catch (e) { fail(e); try { await loadProject(); } catch (_) {} }

}

/* ---------------- data ---------------- */
async function loadProjects(){
  S.projects = await q(sb.from("project").select("id,org_id,name,code").is("archived_at", null).order("created_at"));
  if (!S.project || !S.projects.find(p => p.id === S.project.id)) S.project = S.projects[0] || null;
  if (S.project) await loadProject();
}
async function loadProject(){
  const p = S.project;
  S.tbl = (await q(sb.from("tbl").select("*").eq("project_id", p.id).eq("template_key", "tracker").is("deleted_at", null)))[0];
  S.view = (await q(sb.from("view").select("*").eq("table_id", S.tbl.id).eq("kind", "grid").is("deleted_at", null).order("position")))[0];
  const [levels, fields, vf, members, pipelines] = await Promise.all([
    q(sb.from("tree_level").select("*").eq("table_id", S.tbl.id).order("position")),
    q(sb.from("field").select("*").eq("table_id", S.tbl.id).is("deleted_at", null).order("position")),
    q(sb.from("view_field").select("*").eq("view_id", S.view.id).order("position")),
    q(sb.from("project_member").select("id,display_name,access_role").eq("project_id", p.id).is("removed_at", null).order("display_name")),
    q(sb.from("pipeline").select("*").eq("project_id", p.id).is("archived_at", null).order("position").order("name")),
  ]);
  S.members = members;
  const ids = pipelines.map(x => x.id);
  const stages = ids.length ? await q(sb.from("pipeline_stage").select("*").in("pipeline_id", ids).order("position")) : [];
  const sids = stages.map(s => s.id);
  const deps = sids.length ? await q(sb.from("pipeline_stage_dep").select("*").in("stage_id", sids)) : [];
  S.raw = { levels, fields, vf, pipelines, stages, deps };
  deriveSchema();
  await loadTree(); loadTV();
}
async function loadTree(){
  S.base = await q(sb.rpc("get_tree", { p_table: S.tbl.id }));
  for (const r of S.base) r.level_id = S.raw.levels.find(l => l.name === r.level)?.id || null;
  await loadPlanData(); loadDraft(); rebuild();
}
async function loadPlanData(){
  const ids = S.base.map(r => r.id); const deps = [], segs = [];
  for (let i = 0; i < ids.length; i += 80) { const part = ids.slice(i, i + 80);
    deps.push(...await q(sb.from("record_dep").select("record_id,depends_on_id").in("record_id", part)));
    segs.push(...await q(sb.from("segment").select("id,record_id,kind,gap_type,hours,start_at,end_at,assignee_id,version").in("record_id", part))); }

  S.gapBase = {}; S.segs = {}; S.segAll = {};
  for (const g of segs) { if (g.kind === "gap") { S.gapBase[g.record_id] = { hours: +g.hours || 0, type: g.gap_type }; continue; }
    S.segAll[g.record_id] = g; if (g.start_at && g.end_at) S.segs[g.record_id] = { record: g.record_id, start: whOfIso(g.start_at), end: whOfIso(g.end_at), hours: +g.hours, assignee: g.assignee_id, version: g.version }; }
}
/* the draft lives in the browser until Apply; it survives a reload */
const draftKey = () => "pmkit.draft." + S.project?.id;
function saveDraft(){ try { localStorage.setItem(draftKey(), JSON.stringify(S.draft.ops)); } catch (_) {} if (PREF.autoApply && S.draft.ops.length) scheduleAuto(); }
function loadDraft(){ if (S.draft.project !== S.project.id) { S.draft = { ops:[], undo:[], redo:[], project:S.project.id }; try { S.draft.ops = JSON.parse(localStorage.getItem(draftKey()) || "[]"); } catch (_) {} }
  const ids = new Set(S.base.map(r => r.id)), fids = new Set(S.raw.fields.map(f => f.id)), keep = [];

    if (o.t === "fadd") { fids.add(o.field); keep.push(o); continue; }

    if (o.t === "move" && ((o.parent && !ids.has(o.parent)) || (o.before && !ids.has(o.before)))) continue;

function pushOps(ops, msg){ if (!ops.length) return; draftPush(); S.draft.ops.push(...ops); saveDraft(); rebuild(); render(); if (msg) toast(msg); }
const uid = () => crypto.randomUUID();
/* what the table, columns, levels and pipelines look like = database + the draft on top */
function deriveSchema(){ const R = S.raw, ops = S.draft?.project === S.project?.id ? S.draft.ops : [];

  const order = R.fields.slice().sort((a, b) => (vfm[a.id]?.position ?? 999) - (vfm[b.id]?.position ?? 999)).map(f => f.id);
  const place = (id, before) => { const i = order.indexOf(id); if (i >= 0) order.splice(i, 1); const k = before ? order.indexOf(before) : -1; if (k < 0) order.push(id); else order.splice(k, 0, id); };
  const removed = new Set(S.view.config?.removed || []); const pls = R.pipelines.map(x => ({ ...x })), sts = R.stages.map(x => ({ ...x })); let deps = R.deps.map(x => ({ ...x }));

    else if (o.t === "fadd") { fl.push({ id:o.field, name:o.name, type:o.type, config:o.config || {}, role:null, is_system:false, org_id:S.project.org_id, table_id:S.tbl.id }); place(o.field, o.before); S.fDraft.add(o.field); }
    else if (!f && ["fren","fdel","fopt","fmove","fremove"].includes(o.t)) continue;
    else if (o.t === "fren") { f.name = o.name; S.fDraft.add(f.id); }
    else if (o.t === "fdel") fl = fl.filter(x => x.id !== o.field);
    else if (o.t === "fopt") { f.config = { ...f.config, options: o.options.map(x => x.name), meta: Object.fromEntries(o.options.map(x => [x.name, { color:x.color, ...(x.dim ? { dim:true } : {}), ...(x.done ? { done:true } : {}) }])) }; S.fDraft.add(f.id); }
    else if (o.t === "fmove") { if (f.role !== "title") place(o.field, o.before); }
    else if (o.t === "fremove") o.on ? removed.add(o.field) : removed.delete(o.field);
    else if (o.t === "pl_add") { pls.push({ id:o.pipeline, name:o.name, position: 999 }); S.plDraft.add(o.pipeline); }

      if (o.after) deps.push({ stage_id:o.stage, depends_on_id:o.after }); S.plDraft.add(o.stage); }
    else if (o.t === "ps_set") { const st = sts.find(x => x.id === o.stage); if (st) { st[o.key] = o.value; S.plDraft.add(st.id); } }
    else if (o.t === "dep") { deps = deps.filter(d => !(d.stage_id === o.stage && d.depends_on_id === o.depends_on)); if (o.on) deps.push({ stage_id:o.stage, depends_on_id:o.depends_on }); S.plDraft.add(o.stage); } }
  S.levels = lv; S.pipelines = pls; S.stages = sts; S.deps = deps;
  const pos = Object.fromEntries(order.map((id, i) => [id, i]));
  S.allFields = fl.map(f => ({ ...f, mode: vfm[f.id]?.mode || "edit", vpos: pos[f.id] ?? 999, width: vfm[f.id]?.width || null }))
    .sort((a, b) => (a.role === "title" ? -1 : b.role === "title" ? 1 : a.vpos - b.vpos));

function draftPush(){ S.draft.undo.push(JSON.stringify(S.draft.ops)); if (S.draft.undo.length > 200) S.draft.undo.shift(); S.draft.redo = []; }
function draftCell(rec, f, val){ draftPush(); const base = S.base.find(r => r.id === rec)?.data?.[f.id] ?? null;
  S.draft.ops = S.draft.ops.filter(o => !(o.t === "cell" && o.record === rec && o.field === f.id));
  if (JSON.stringify(base) !== JSON.stringify(val ?? null)) S.draft.ops.push({ t:"cell", record:rec, field:f.id, value: val ?? null, base });
  saveDraft(); rebuild(); }
/* what the sheets show = database state + the draft on top */

/* ---------------- time: working hours counted from a fixed Monday; 8 h a day, Mon–Fri ---------------- */
const HPD = 8, EPOCH = Date.UTC(2026, 0, 5), DAY = 864e5, DAYW = 36;
const STEPS = [[1, "1 hour"], [2, "2 hours"], [4, "Half a day"], [8, "1 day"]];
const calOfWd = D => Math.floor(D / 5) * 7 + (D % 5);
function whOfDate(ms){ const days = Math.floor((ms - EPOCH) / DAY); const w = Math.floor(days / 7), dow = days - w * 7; return dow > 4 ? (w + 1) * 5 * HPD : (w * 5 + dow) * HPD; }
function whOfIso(iso){ const ms = Date.parse(iso); const days = Math.floor((ms - EPOCH) / DAY); const dow = days - Math.floor(days / 7) * 7; const base = whOfDate(ms);
  if (dow > 4) return base; const h = (ms - (EPOCH + days * DAY)) / 36e5 - 9; return Math.round((base + Math.max(0, Math.min(HPD, h))) * 100) / 100; }
function isoOfWh(wh, isEnd){ let D = Math.floor(wh / HPD + 1e-9), h = wh - D * HPD; if (isEnd && h < 1e-9 && D > 0) { D -= 1; h = HPD; } return new Date(EPOCH + calOfWd(D) * DAY + (9 + h) * 36e5).toISOString(); }
const todayWh = () => { const n = new Date(); return whOfDate(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())); };
const fmtDay = (wh, isEnd) => new Date(EPOCH + calOfWd(Math.max(0, Math.floor((isEnd ? wh - 0.001 : wh) / HPD + 1e-9))) * DAY).toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"2-digit", timeZone:"UTC" });
const fmtWh = (wh, isEnd) => new Date(EPOCH + calOfWd(Math.max(0, Math.floor((isEnd ? wh - 0.001 : wh) / HPD + 1e-9))) * DAY).toLocaleDateString("en-GB", { day:"2-digit", month:"short", timeZone:"UTC" });
const asgOf = r => { const f = byRole("assignee"); return (f && r.data?.[f.id]) || null; };
function isDone(r){ const st = byRole("status"); const v = st && r.data?.[st.id]; if (!v) return false; const m = st.config?.meta || {};
  return Object.values(m).some(x => x.done) ? !!m[v]?.done : (!!m[v]?.dim || /^approved/i.test(v)); }
const isUnder = (r, id) => { let x = r; while (x) { if (x.id === id) return true; x = S.row[x.parent_id]; } return false; };

/* the calendar strip both plan sheets draw on */
function planView(){ const segs = Object.values(S.segEff); const now = todayWh();
  const a = Math.min(now, ...segs.map(s => s.start)), b = Math.max(now + 15 * HPD, ...segs.map(s => s.end + (S.gapOf[s.record]?.hours || 0)));
  const c0raw = calOfWd(Math.max(0, Math.floor(a / HPD) - 2)); const c0 = c0raw - (c0raw % 7); const c1 = calOfWd(Math.ceil(b / HPD) + 6); const cal = [];
  for (let c = c0; c <= c1; c++) cal.push({ c, we: c % 7 > 4, date: new Date(EPOCH + c * DAY) });
  const x = wh => { const D = Math.floor(wh / HPD + 1e-9); return (calOfWd(D) - c0 + (wh - D * HPD) / HPD) * DAYW; };
  const xEnd = wh => { const D = Math.max(0, Math.floor((wh - 1e-6) / HPD)); return (calOfWd(D) - c0 + (wh - D * HPD) / HPD) * DAYW; };   // an end at the close of a day stays in that day
  const whAt = px => { const cf = px / DAYW + c0; let c = Math.floor(cf), fr = cf - c; const dow = ((c % 7) + 7) % 7; if (dow > 4) { c += 7 - dow; fr = 0; } const w = Math.floor(c / 7); return (w * 5 + (c - w * 7)) * HPD + fr * HPD; };
  return { cal, c0, x, xEnd, whAt, width: cal.length * DAYW, now }; }

/* what is wrong with the stored plan: nothing moves by itself, problems are only shown */
function planConflicts(){ const out = {}; const add = (id, m) => (out[id] ||= []).push(m); const segs = S.segEff;
  for (const [id, s] of Object.entries(segs)) { const r = S.row[id]; if (!r || isDone(r)) continue;
    if (Math.abs(s.hours - (+r.estimate_h || 0)) > 0.01) add(id, `Bar is ${num(s.hours)} h, estimate is ${num(r.estimate_h) || 0} h`);
    if ((s.assignee || null) !== asgOf(r)) add(id, `Planned for ${memberName(s.assignee) || "nobody"}, the row says ${memberName(asgOf(r)) || "nobody"}`);
    for (const d of S.depsOf[id] || []) { const ds = segs[d], dr = S.row[d]; if (!dr || isDone(dr)) continue;
      if (!ds) add(id, `“${dr.title}” is not on the plan yet`);
      else if (s.start < ds.end + (S.gapOf[d]?.hours || 0) - 0.01) add(id, `Starts before “${dr.title}” is finished${S.gapOf[d]?.hours ? " and reviewed" : ""}`); } }
  const by = {}; for (const [id, s] of Object.entries(segs)) if (s.assignee && S.row[id] && !isDone(S.row[id])) (by[s.assignee] ||= []).push([id, s]);
  for (const l of Object.values(by)) { l.sort((p, q2) => p[1].start - q2[1].start);
    for (let i = 1; i < l.length; i++) if (l[i][1].start < l[i - 1][1].end - 0.01) { add(l[i][0], `Overlaps with “${S.row[l[i - 1][0]].title}” (same person)`); add(l[i - 1][0], `Overlaps with “${S.row[l[i][0]].title}” (same person)`); } }
  return out; }

/* plan changes go to the draft in planning mode, or straight to the database in direct mode */
function planPayload(ops){ return ops.map(o => o.t === "cell" ? { t:"cell", record:o.record, field:o.field, value:o.value, base:o.base }
  : o.t === "seg" ? { t:"seg", record:o.record, start: isoOfWh(o.start), end: isoOfWh(o.end, true), hours:o.hours, assignee:o.assignee, version:o.version }
  : o.t === "unplan" ? { t:"unplan", record:o.record, version:o.version } : o.t === "del" ? { t:"del", record:o.record }
  : o.t === "move" ? { t:"move", record:o.record, parent:o.parent, before:o.before } : o); }
function commitPlanOps(ops, summary){ if (!ops.length) return render();
  draftPush(); const ids = new Set(ops.map(o => o.record)); S.draft.ops = S.draft.ops.filter(o => !((o.t === "seg" || o.t === "unplan") && ids.has(o.record))).concat(ops); saveDraft(); rebuild(); render(); toast(summary + " — in the draft, press Apply to save"); }
const segVersion = id => S.segAll[id]?.version ?? null;
function autoplan(all){ const now = todayWh(), step = S.step; const up = h => Math.ceil((h - 1e-9) / step) * step;
  const todo = S.tree.filter(r => r.is_leaf && !isDone(r) && +r.estimate_h > 0 && (all || !S.segEff[r.id])); if (!todo.length) return toast(all ? "No open work to plan" : "Everything open is already on the plan");
  const inTodo = new Set(todo.map(r => r.id)); const placed = {}, free = {};
  for (const [id, s] of Object.entries(S.segEff)) { const r = S.row[id]; if (!r || inTodo.has(id)) continue; placed[id] = s; if (s.assignee && !isDone(r)) free[s.assignee] = Math.max(free[s.assignee] || now, s.end); }
  const list = [...todo], ops = []; let guard = 0;
  while (list.length && guard++ < 9999) { let i = list.findIndex(r => (S.depsOf[r.id] || []).every(d => !list.some(x => x.id === d))); if (i < 0) i = 0; const r = list.splice(i, 1)[0];
    const who = asgOf(r); let start = who ? (free[who] || now) : now;
    for (const d of S.depsOf[r.id] || []) if (placed[d]) start = Math.max(start, placed[d].end + (S.gapOf[d]?.hours || 0));
    start = up(Math.max(start, now)); const hours = +r.estimate_h, end = start + hours; placed[r.id] = { start, end }; if (who) free[who] = end;
    ops.push({ t:"seg", record:r.id, start, end, hours, assignee:who, version: segVersion(r.id) }); }
  commitPlanOps(ops, all ? `Autoplan: ${ops.length} stages from today` : `Autoplan: ${ops.length} unplanned stages`); }
function barMenu(id, x, y){ const r = S.row[id], s = S.segEff[id]; if (!r || !s) return; const conf = planConflicts()[id] || []; const items = [{ head: r.title + " · " + fmtWh(s.start) + " → " + fmtWh(s.end, true) }];
  for (const c of conf) items.push({ label: "⚠ " + c, disabled:true });
  items.push("-", { label:"Fit the bar to the estimate", disabled: Math.abs(s.hours - (+r.estimate_h || 0)) < 0.01, run: () => commitPlanOps([{ t:"seg", record:id, start:s.start, end:s.start + (+r.estimate_h || 0), hours:+r.estimate_h || 0, assignee:s.assignee, version: segVersion(id) }], "Bar fitted: " + r.title) },
    { label:"Plan it for the row's realizer", disabled: (s.assignee || null) === asgOf(r), run: () => commitPlanOps([{ t:"seg", record:id, start:s.start, end:s.end, hours:s.hours, assignee: asgOf(r), version: segVersion(id) }], "Realizer updated: " + r.title) },
    "-", { label:"Remove from the plan", danger:true, run: () => commitPlanOps([{ t:"unplan", record:id, version: segVersion(id) }], "Removed from the plan: " + r.title) });
  openMenu(x, y, items); }

/* ---------------- gantt: the stored plan ---------------- */
function sheetGantt(){
  const V = planView(); const conf = planConflicts(); const palette = ["#2f7fc1","#3f8f6b","#7a5fb0","#c2772b","#5b4a9e","#b5483a","#10635f","#9a7b2e"];
  const colorOf = id => { const i = S.members.findIndex(m => m.id === id); return i < 0 ? "#8a93a3" : palette[i % palette.length]; };
  const drafted = new Set(S.draft.ops.filter(o => o.t !== "cell").map(o => o.record));
  const weHtml = V.cal.map((c, i) => c.we ? `<div class="gwe" style="left:${i * DAYW}px"></div>` : "").join("");
  const span = {}; for (const [id, s] of Object.entries(S.segEff)) { let x = S.row[S.row[id]?.parent_id]; while (x) { const sp = span[x.id] ||= { a:Infinity, b:0 }; sp.a = Math.min(sp.a, s.start); sp.b = Math.max(sp.b, s.end); x = S.row[x.parent_id]; } }
  const rows = visibleRows(); const kids = new Set(S.tree.map(r => r.parent_id).filter(Boolean)); let body = "";
  for (const r of rows) { const s = S.segEff[r.id]; let bar = "";
    if (r.is_leaf && s) { const l = V.x(s.start), w = Math.max(8, V.xEnd(s.end) - l); const c = conf[r.id]; const g = S.gapOf[r.id];
      bar = `<div class="gbar ${c ? "bad" : ""} ${drafted.has(r.id) ? "dr" : ""} ${isDone(r) ? "old" : ""}" data-bar="${r.id}" style="left:${l}px;width:${w}px;--c:${colorOf(s.assignee)}" title="${esc(r.title)} · ${esc(memberName(s.assignee) || "Unassigned")} · ${fmtWh(s.start)} → ${fmtWh(s.end, true)} · ${num(s.hours)} h${c ? "\n⚠ " + esc(c.join("\n⚠ ")) : ""}">${c ? "⚠ " : ""}${w > 60 ? esc(memberName(s.assignee) || "") : ""}</div>`;
      if (g?.hours && !isDone(r)) bar += `<div class="gbar gap" data-gapof="${r.id}" style="left:${V.x(s.end)}px;width:${Math.max(8, V.xEnd(s.end + g.hours) - V.x(s.end))}px" title="${esc((g.type || "review").replace("_", " "))} · ${num(g.hours)} h">R</div>`; }
    else if (r.is_leaf) bar = `<span class="gdone">${isDone(r) ? "done" : +r.estimate_h > 0 ? "not on the plan" : "no estimate"}</span>`;
    else if (span[r.id]) bar = `<div class="gbar span" data-bar="${r.id}" style="left:${V.x(span[r.id].a)}px;width:${Math.max(8, V.xEnd(span[r.id].b) - V.x(span[r.id].a))}px" title="${esc(r.title)} · ${fmtWh(span[r.id].a)} → ${fmtWh(span[r.id].b, true)} · drag to move everything inside"></div>`;
    body += `<div class="gr d${Math.min(r.depth, 3)}"><div class="gname" style="padding-left:${8 + r.depth * 16}px"><button class="caret ${kids.has(r.id) ? "" : "leaf"}" data-act="toggle" data-id="${r.id}">${S.collapsed.has(r.id) ? "▸" : "▾"}</button><span class="ttl" title="${esc(r.level || "")}">${esc(r.title || "")}</span></div><div class="gtrack" style="width:${V.width}px">${weHtml}${bar}</div></div>`; }
  const open = S.tree.filter(r => r.is_leaf && !isDone(r) && +r.estimate_h > 0); const planned = open.filter(r => S.segEff[r.id]).length; const nConf = Object.keys(conf).length;
  const first = Object.entries(conf)[0];
  return `<div class="tb">${draftBar()}<button class="tbtn" data-act="autoplan">⚡ Autoplan ▾</button><span class="tsep"></span>
      <span class="kick">Step</span><select id="step" class="stepsel">${STEPS.map(([h, n]) => `<option value="${h}" ${S.step === h ? "selected" : ""}>${n}</option>`).join("")}</select>
      <span class="sp"></span>${nConf ? `<span class="tag bad">⚠ ${nConf} conflict${nConf > 1 ? "s" : ""}</span>` : planned ? `<span class="tag ok">No conflicts</span>` : ""}</div>
    <div class="cb"><div class="ref">${nConf ? "First conflict" : "How it works"}</div><input readonly value="${nConf ? esc(S.row[first[0]]?.title + ": " + first[1][0] + ". Right-click the bar to fix it, or use Autoplan.") : "Drag a stage to move it alone; drag the bar of an asset or batch to move everything inside. Nothing moves by itself: when an estimate or a person changes, the bar is marked and you decide."}">
      <span class="hint">${planned}/${open.length} open stages planned</span></div>
    <div class="main" tabindex="0"><div class="gwrap"><div class="gnow" style="left:${330 + V.x(V.now)}px" title="Today"></div><div class="gh"><div class="gname">Asset / stage</div><div class="gdays">${V.cal.map(c => `<div class="gd ${c.we ? "we" : ""} ${c.c % 7 === 0 ? "mo" : ""}" style="width:${DAYW}px"><span>${"MTWTFSS"[c.c % 7]}</span><span>${c.date.getUTCDate()}</span></div>`).join("")}</div></div>${body || `<div class="empty">No rows yet.</div>`}</div></div>
    <div class="stat"><div>On the plan<b>${planned}</b></div><div>Not planned<b>${open.length - planned}</b></div><div>Conflicts<b>${nConf}</b></div><div>Step<b>${STEPS.find(x => x[0] === S.step)[1]}</b></div><div style="border:0">8 h a day, Mon–Fri · no vacations or holidays yet</div>${viewBar()}</div>`;
}

/* ---------------- workload: the same stored plan per person per day ---------------- */
function sheetWorkload(){
  const V = planView(); const load = {}, tasks = {}; let total = 0;
  for (const [id, s] of Object.entries(S.segEff)) { const r = S.row[id]; if (!r || isDone(r)) continue; const who = s.assignee || "none"; const L = load[who] ||= {}, T = tasks[who] ||= {}; total += s.end - s.start;
    for (let h = s.start; h < s.end - 1e-9;) { const D = Math.floor(h / HPD + 1e-9); const upto = Math.min(s.end, (D + 1) * HPD); L[D] = (L[D] || 0) + (upto - h); (T[D] ||= []).push((S.row[r.parent_id]?.title || "") + " · " + r.title); h = upto; } }
  const people = [...S.members.map(m => ({ id:m.id, name:m.display_name, role:m.access_role })), { id:"none", name:"Unassigned", role:"" }]; let body = "", over = 0;
  for (const m of people) { const L = load[m.id] || {}; const sum = Object.values(L).reduce((a, b) => a + b, 0); if (m.id === "none" && !sum) continue; const last = Math.max(-1, ...Object.keys(L).map(Number));
    body += `<tr><td style="min-width:200px;font-weight:600">${esc(m.name)}</td><td style="color:var(--muted);min-width:70px">${esc(m.role)}</td><td class="num" style="min-width:70px">${num(sum)}</td><td style="min-width:100px;color:var(--muted)">${sum ? "after " + fmtWh(last * HPD) : "now"}</td>
      ${V.cal.map(c => { if (c.we) return `<td class="h we"></td>`; const w = Math.floor(c.c / 7); const D = w * 5 + (c.c - w * 7); const h = L[D] || 0; if (m.id !== "none" && h > HPD + 0.01) over++;
        const cls = m.id !== "none" && h > HPD + 0.01 ? "overb" : h >= HPD - 0.01 ? "full" : h ? "part" : "free"; return `<td class="h ${cls}" title="${esc((tasks[m.id]?.[D] || []).join("\n"))}">${h ? num(h) : "·"}</td>`; }).join("")}</tr>`; }
  return `<div class="tb">${draftBar()}<div class="glegend" style="padding-left:2px"><span><i style="background:#d9ebf8"></i>full day</span><span><i style="background:#eef6fc;border:1px solid var(--rule)"></i>part of a day</span><span><i style="background:#f6d5cf"></i>more than 8 h</span><span>· free</span></div><span class="sp"></span>${over ? `<span class="tag bad">⚠ ${over} overbooked day${over > 1 ? "s" : ""}</span>` : ""}</div>
    <div class="cb"><div class="ref">Where these hours come from</div><input readonly value="The plan from the Gantt sheet${S.draft.ops.length ? ", including your draft" : ""}, seen per person and per day. Hover a cell to see what the person works on that day."><span class="hint"></span></div>
    <div class="main" tabindex="0"><table class="grid wl"><thead><tr><th>Person</th><th>Role</th><th>Hours</th><th>Free</th>${V.cal.map(c => `<th class="d ${c.we ? "we" : ""}">${"MTWTFSS"[c.c % 7]}<br>${c.date.getUTCDate()}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="stat"><div>People with work<b>${Object.keys(load).filter(k => k !== "none").length}</b></div><div>Hours on the plan<b>${num(total)} h</b></div><div style="border:0">8 h a day · no vacations or holidays yet</div>${viewBar()}</div>`;
}

/* ---------------- pipelines ---------------- */
function sheetPipelines(){
  const gaps = [["","None"],["client_review","Client review"],["internal_review","Internal review"],["pending","Pending"]];
  let h = `<div class="tb">${draftBar()}<span class="sp"></span><span class="tag">Pipelines are saved as you edit them</span></div><div class="main"><div class="pad">`;
  for (const p of S.pipelines) { const st = S.stages.filter(s => s.pipeline_id === p.id);
    h += `<div class="panel"><div class="bar"><span class="t">${esc(p.name)}</span><span class="n">${st.length} stages · ${st.reduce((a, s) => a + (+s.default_hours || 0), 0)} h</span></div>
    <table class="plain"><thead><tr><th style="width:36px">#</th><th>Stage</th><th style="width:110px">Default, h</th><th style="width:170px">After the stage</th><th>Can start after</th></tr></thead><tbody>
    ${st.map((s, i) => `<tr><td>${i + 1}</td><td><input data-ps="${s.id}" data-k="name" value="${esc(s.name)}"></td>
      <td><input type="number" min="0" step="0.5" data-ps="${s.id}" data-k="default_hours" value="${s.default_hours ?? ""}"></td>
      <td><select data-ps="${s.id}" data-k="gap_type">${gaps.map(([v, n]) => `<option value="${v}" ${(s.gap_type || "") === v ? "selected" : ""}>${n}</option>`).join("")}</select></td>
      <td><div class="dchips">${st.filter(o => o.id !== s.id).map(o => `<button class="dchip ${S.deps.some(d => d.stage_id === s.id && d.depends_on_id === o.id) ? "on" : ""}" data-act="dep" data-s="${s.id}" data-o="${o.id}">${esc(o.name)}</button>`).join("") || "—"}</div></td></tr>`).join("")}
    </tbody></table><form class="form" data-form="stage" data-pl="${p.id}"><label>New stage</label><input name="name" placeholder="Name" required autocomplete="off"><input name="hours" type="number" min="0" step="0.5" placeholder="Hours" style="width:90px"><button class="tbtn" type="submit">+ Stage</button></form></div>`; }
  h += `<div class="panel"><form class="form" data-form="pipeline"><label>New pipeline</label><input name="name" placeholder="Name, e.g. Characters" required autocomplete="off" style="width:260px"><button class="tbtn pri" type="submit">+ Pipeline</button></form></div>
    <p class="note" style="max-width:900px"><b>How it works.</b> A stage with nothing selected can start at any time. Textures after Bakes and LODs after Low poly means the two can run in parallel. Changing a pipeline affects only assets created afterwards. A circular dependency is rejected by the database.</p></div></div>`;
  return h;
}

/* ---------------- history ---------------- */
function sheetHistory(){
  const kinds = { edit:"Edit", schema:"Structure", pipeline:"Pipeline", revert:"Undo", split:"Split", import:"Import", auto_shift:"Auto shift", draft_apply:"Plan" };
  return `<div class="tb">${draftBar()}<button class="tbtn" data-act="reloadhistory">Refresh</button><span class="sp"></span><span class="tag">Every saved change is recorded · nothing is erased</span></div>
  <div class="main"><table class="plain"><thead><tr><th style="width:160px">When</th><th style="width:100px">Kind</th><th>What</th><th style="width:80px">Lines</th><th style="width:120px"></th></tr></thead><tbody>
  ${S.batches.map(b => `<tr><td style="font-family:var(--font-mono);font-size:11.5px;color:var(--muted)">${new Date(b.created_at).toLocaleString("en-GB", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit", second:"2-digit" })}</td>
    <td><span class="tag ${b.kind === "revert" ? "warn" : ""}">${kinds[b.kind] || b.kind}</span></td><td>${esc(b.summary || "")}</td><td>${b.change_log?.[0]?.count ?? ""}</td>
    <td>${b.reverted_by ? `<span class="tag off">undone</span>` : S.draft.ops.some(o => o.t === "revert" && o.batch === b.id) ? `<span class="tag" title="Apply takes it back">in the draft</span>` : b.kind === "revert" ? "" : !b.actor_id ? `<span class="tag off" title="Created during setup">setup</span>` : `<button class="tbtn" data-act="revert" data-id="${b.id}" title="Puts the reverse change into the draft">Take back…</button>`}</td></tr>`).join("") || `<tr><td colspan="5"><div class="empty">No changes yet.</div></td></tr>`}
  </tbody></table></div>`;
}

/* ---------------- events ---------------- */
document.addEventListener("mousedown", e => { if (!e.target.closest(".menu")) closeMenu(); });
$app.addEventListener("click", async e => {
  const t = e.target; const mb = t.closest("[data-menu]"); if (mb) { const bx = mb.getBoundingClientRect(); return mainMenu(mb.dataset.menu, bx.left, bx.bottom + 1); }
  const b = t.closest("[data-sheet],[data-act]");
  if (b?.dataset.sheet) { S.sheet = b.dataset.sheet; S.editing = false; closeMenu();
    try { if (S.sheet === "history") await loadHistory(); if (S.sheet === "gantt" || S.sheet === "workload") await loadTree(); } catch (err) { fail(err); } return render(); }
  if (b) { const a = b.dataset.act, id = b.dataset.id;
    if (a === "out") return sb.auth.signOut();
    if (a === "prefs") return openPrefs("general");
    if (a === "pwd") { const p = window.prompt("New password (at least 8 characters):"); if (!p) return; if (p.length < 8) return toast("Too short", true); const { error } = await sb.auth.updateUser({ password: p }); return error ? fail(error) : toast("Password changed"); }
    if (a === "toggle") { S.collapsed.has(id) ? S.collapsed.delete(id) : S.collapsed.add(id); return render(); }
    if (a === "collapse") { S.tree.filter(r => r.depth >= 1 && !r.is_leaf).forEach(r => S.collapsed.add(r.id)); return render(); }
    if (a === "expand") { S.collapsed.clear(); return render(); }
    if (a === "fsdown" || a === "fsup") { VIEW.fs += a === "fsup" ? 1 : -1; applyView(true); return render(); }
    if (a === "zoomout" || a === "zoomin") { VIEW.zoom += a === "zoomin" ? 10 : -10; applyView(true); return render(); }
    if (a === "undo") return undo();
    if (a === "redo") return redo();
    if (a === "apply") return applyDraft();
    if (a === "discard") return discardDraft();
    if (a === "autoplan") { const box = b.getBoundingClientRect(); return openMenu(box.left, box.bottom + 2, [{ head:"Step: " + STEPS.find(x => x[0] === S.step)[1] }, { label:"Place unplanned work after what is planned", run: () => autoplan(false) }, { label:"Replan all open work from today", run: () => autoplan(true) },
      "-", { label:"Remove everything from the plan", danger:true, run: () => commitPlanOps(Object.keys(S.segEff).map(id => ({ t:"unplan", record:id, version: segVersion(id) })), "Plan cleared") }]); }
    if (a === "cols") { const box = b.getBoundingClientRect(); return openColumns(box.right - 250, box.bottom + 2); }
    if (a === "structure") return openStructure();
    if (a === "sclear") { S.sort = null; saveTV(); return render(); }
    if (a === "fclear") return clearFilters();
    if (a === "addroot") return addRow(null, enabledLevels()[0], null);
    if (a === "addrow") { const r = S.row[S.sel?.r]; return r ? addRow(r.parent_id, levelOf(r), nextSibling(r)?.id || null) : addRow(null, enabledLevels()[0], null); }
    if (a === "addmenu") { const bx = b.getBoundingClientRect(); return mainMenu("insert", bx.left, bx.bottom + 2); }
    if (a === "addchild") { const r = S.row[S.sel?.r]; return r && addRow(r.id, childLevel(r), null); }
    if (a === "addfield") return addField(null);
    if (a === "settings") return openSettings();
    if (a === "colmenu") { const r = b.getBoundingClientRect(); const f = columns().find(c => c.id === b.dataset.f); return f && colMenu(f, r.left, r.bottom + 2); }
    if (a === "dep") return pushOps([{ t:"dep", stage:b.dataset.s, depends_on:b.dataset.o, on: !b.classList.contains("on") }]);
    if (a === "reloadhistory") { try { await loadHistory(); } catch (err) { fail(err); } return render(); }
    if (a === "revert") return undoEntry(id);
  }
  if (S.sheet !== "tracker") return;
  const td = t.closest("td[data-f]"); const tr = t.closest("tr[data-id]");
  if (td && tr && !t.closest("a")) { const same = S.sel && !S.sel.row && S.sel.r === tr.dataset.id && S.sel.f === td.dataset.f; const f = columns().find(x => x.id === td.dataset.f);
    if (S.editing && same) return; const box = !!t.closest(".box");
    if (!box && (e.shiftKey || (IS_MAC ? e.metaKey : e.ctrlKey))) { const id = tr.dataset.id; S.editing = false;
      if (e.shiftKey && S.sel) rangeTo(id); else { S.multi ||= new Set(S.sel ? [S.sel.r] : []); S.multi.has(id) && S.multi.size > 1 ? S.multi.delete(id) : S.multi.add(id); S.anchor = id; }
      S.sel = { r: id, f: td.dataset.f, row:true }; return render(); }
    if (!box) { S.multi = null; S.anchor = tr.dataset.id; }
    if (!box && !(S.sel && S.sel.r === tr.dataset.id)) { S.sel = { r: tr.dataset.id, f: td.dataset.f, row:true }; S.editing = false; return render(); }
    S.sel = { r: tr.dataset.id, f: td.dataset.f, row:false }; S.editing = false; render();
    if (f && (f.type === "checkbox" || (same && ["select","person","link"].includes(f.type)))) startEdit(); }
});
$app.addEventListener("dblclick", e => { const td = e.target.closest("td[data-f]"), tr = e.target.closest("tr[data-id]"); if (S.sheet !== "tracker" || !td || !tr || S.editing) return;
  S.sel = { r: tr.dataset.id, f: td.dataset.f, row:false }; render(); startEdit(); });
$app.addEventListener("contextmenu", e => { const gb = S.sheet === "gantt" && e.target.closest(".gbar[data-bar]"); if (gb && S.row[gb.dataset.bar]?.is_leaf) { e.preventDefault(); return barMenu(gb.dataset.bar, e.clientX, e.clientY); }
  if (S.sheet !== "tracker") return; const tr = e.target.closest("tr[data-id]"); const th = e.target.closest("th[data-f]");
  if (tr) { e.preventDefault(); const td = e.target.closest("td[data-f]"); S.multi = null; S.sel = { r: tr.dataset.id, f: td?.dataset.f || S.fields[0].id, row:true }; render(); return rowMenu(S.row[tr.dataset.id], e.clientX, e.clientY); }
  if (th) { const f = columns().find(x => x.id === th.dataset.f); if (f) { e.preventDefault(); colMenu(f, e.clientX, e.clientY); } } });
$app.addEventListener("keydown", e => {
  if (e.target.id === "cellbar") { e.stopPropagation();
    if (e.key === "Enter" && S.sel && !e.target.readOnly) { e.preventDefault(); const r = S.row[S.sel.r], f = columns().find(x => x.id === S.sel.f); let v = e.target.value.trim();
      if (["number","money","duration"].includes(f.type)) { v = v === "" ? null : Number(v.replace(",", ".")); if (Number.isNaN(v)) return toast("This cell needs a number", true); } else if (v === "") v = null; e.target.blur(); return setCell(r.id, f, v); }
    if (e.key === "Escape") { e.target.blur(); render(); } return; }
  if (S.sheet !== "tracker" || S.editing || !e.target.classList.contains("main")) return; const k = e.key;
  if (e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey && (k === "ArrowDown" || k === "ArrowUp")) { e.preventDefault(); return extendSel(k === "ArrowDown" ? 1 : -1); }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!S.sel || S.sel.row) {   // row mode
    if (k === "ArrowDown") { e.preventDefault(); return moveRowSel(1); } if (k === "ArrowUp") { e.preventDefault(); return moveRowSel(-1); }
    if (!S.sel) return;
    if (k === "ArrowRight" || k === "Enter" || k === "F2") { e.preventDefault(); return enterCell(); }
    if (k === "ArrowLeft" || k === "Tab") { e.preventDefault(); return; }
    if (k === "Escape") { if (document.querySelector(".menu")) return closeMenu(); if (S.multi) { S.multi = null; S.anchor = S.sel.r; return render(); } return; }
    return; }
  if (k === "ArrowDown") { e.preventDefault(); return moveSel(1, 0); } if (k === "ArrowUp") { e.preventDefault(); return moveSel(-1, 0); }
  if (k === "ArrowRight") { e.preventDefault(); return moveSel(0, 1); }
  if (k === "ArrowLeft") { e.preventDefault(); return columns().findIndex(x => x.id === S.sel.f) <= 0 ? select(S.sel.r, S.sel.f, true, true) : moveSel(0, -1); }
  if (k === "Tab") { e.preventDefault(); return moveSel(0, e.shiftKey ? -1 : 1); }
  if (k === "Enter" || k === "F2") { e.preventDefault(); return startEdit(); }
  if (k === " ") { const f = columns().find(x => x.id === S.sel.f); if (f?.type === "checkbox") { e.preventDefault(); return startEdit(); } }
  if (k === "Delete" || k === "Backspace") { const r = S.row[S.sel.r], f = columns().find(x => x.id === S.sel.f); e.preventDefault();
    if (r && f?.kind === "start" && r.is_leaf && S.segEff[r.id]) return setStart(r, "");
    if (!r || !f || f.virtual || isRollup(r, f) || f.role === "title") return; return setCell(r.id, f, f.type === "checkbox" ? false : null); }
  if (k === "Escape") { if (document.querySelector(".menu")) return closeMenu(); return select(S.sel.r, S.sel.f, false, true); }
  if (k.length === 1) { const f = columns().find(x => x.id === S.sel.f); if (f && !f.virtual && ["text","number","money","duration"].includes(f.type)) { e.preventDefault(); return startEdit(k); } }
});
$app.addEventListener("input", e => { if (e.target.id === "vzoom") { VIEW.zoom = +e.target.value; applyView(true); const v = document.getElementById("vzoomval"); if (v) v.textContent = VIEW.zoom + "%"; return; }
  if (e.target.id === "search") { S.search = e.target.value; const pos = e.target.selectionStart; render(); const s = document.getElementById("search"); s.focus(); s.setSelectionRange(pos, pos); } });
$app.addEventListener("change", e => { const el = e.target;
  if (el.id === "hidedone") { S.hideDone = el.checked; saveTV(); return render(); }
  if (el.id === "vfont") { VIEW.font = el.value; applyView(true); return; }
  if (el.id === "step") { S.step = +el.value; try { localStorage.setItem("pmkit.step", S.step); } catch (_) {} return render(); }
  if (el.id === "proj") { if (S.draft.ops.length) saveDraft(); S.project = S.projects.find(p => p.id === el.value); S.collapsed.clear(); S.sel = null; return act(async () => { if (S.sheet === "history") await loadHistory(); }, { schema:true }); }
  if (el.dataset.ps) { const k = el.dataset.k; let v = el.value; if (k === "default_hours" || k === "gap_hours") v = v === "" ? null : Number(v); if (k === "gap_type") v = v || null; if (k === "name" && !v.trim()) { toast("Stage name cannot be empty", true); return render(); }
    return pushOps([{ t:"ps_set", stage: el.dataset.ps, key:k, value: v }]); } });
$app.addEventListener("submit", e => { const f = e.target; if (f.id === "lf") return; e.preventDefault();
  if (f.dataset.form === "pipeline") { const name = f.elements.name.value.trim(); if (!name) return; if (S.pipelines.some(p => p.name === name)) return toast("A pipeline with this name exists", true); return pushOps([{ t:"pl_add", pipeline: uid(), name }], "Pipeline created in the draft"); }
  if (f.dataset.form === "stage") { const pl = f.dataset.pl; const st = S.stages.filter(s => s.pipeline_id === pl); const name = f.elements.name.value.trim(); const hours = f.elements.hours.value;
    if (!name) return; const last = st.slice().sort((a, b) => a.position - b.position).pop();
    return pushOps([{ t:"ps_add", stage: uid(), pipeline: pl, name, hours: hours === "" ? null : Number(hours), after: last?.id || null }], "Stage added to the draft"); } });

/* gantt: drag a stage alone, or the bar of an asset / batch with everything inside */
$app.addEventListener("pointerdown", e => { if (S.sheet !== "gantt" || e.button !== 0) return; const bar = e.target.closest(".gbar[data-bar]"); if (!bar) return; closeMenu();
  const id = bar.dataset.bar; const ids = S.tree.filter(r => r.is_leaf && S.segEff[r.id] && isUnder(r, id)).map(r => r.id); if (!ids.length) return;
  const els = [...document.querySelectorAll(".gbar[data-bar],.gbar[data-gapof]")].filter(el => { const k = el.dataset.bar || el.dataset.gapof; return ids.includes(k) || (el.dataset.bar && S.row[k] && !S.row[k].is_leaf && (k === id || isUnder(S.row[k], id))); });
  const x0 = e.clientX; let dx = 0; bar.setPointerCapture(e.pointerId); bar.style.cursor = "grabbing";
  const move = ev => { dx = (ev.clientX - x0) / zf(); els.forEach(el => { el.style.transform = `translateX(${dx}px)`; }); };
  const up = () => { bar.removeEventListener("pointermove", move); bar.removeEventListener("pointerup", up); bar.removeEventListener("pointercancel", up);
    if (Math.abs(dx) < 4) { els.forEach(el => { el.style.transform = ""; }); bar.style.cursor = ""; const c = planConflicts()[id]; if (c) toast("⚠ " + c.join(" · "), true); return; }
    const V = planView(); const ref = Math.min(...ids.map(k => S.segEff[k].start)); const target = Math.round(V.whAt(V.x(ref) + dx) / S.step) * S.step; const delta = target - ref;
    if (!delta) return render();
    commitPlanOps(ids.map(k => { const s = S.segEff[k]; return { t:"seg", record:k, start:s.start + delta, end:s.end + delta, hours:s.hours, assignee:s.assignee, version: segVersion(k) }; }), "Moved: " + (S.row[id]?.title || "")); };
  bar.addEventListener("pointermove", move); bar.addEventListener("pointerup", up); bar.addEventListener("pointercancel", up); });
/* column width: drag the right edge of a header */
$app.addEventListener("mousedown", e => { const h = e.target.closest?.("[data-rz]"); if (!h) return; e.preventDefault(); e.stopPropagation();
  const th = h.closest("th"); const id = h.dataset.rz; const x0 = e.clientX, w0 = th.getBoundingClientRect().width / zf(); let w = w0; h.classList.add("on");
  const cells = document.querySelectorAll(`.grid [data-f="${id}"]`);
  const move = ev => { w = Math.max(48, Math.min(700, Math.round(w0 + (ev.clientX - x0) / zf()))); cells.forEach(c => { c.style.width = c.style.minWidth = c.style.maxWidth = w + "px"; }); };
  const up = () => { document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", up); if (Math.abs(w - w0) < 2) return render();
    act(() => q(sb.from("view_field").update({ width: w }).eq("view_id", S.view.id).eq("field_id", id)), { schema:true }); };
  document.addEventListener("mousemove", move); document.addEventListener("mouseup", up); });
$app.addEventListener("mousedown", e => { if ((e.shiftKey || e.ctrlKey || e.metaKey) && e.target.closest?.(".grid tbody td")) { e.preventDefault(); document.querySelector(".main")?.focus({ preventScroll:true }); } });
/* drag rows and columns */
const clearDrop = () => document.querySelectorAll(".dropT,.dropB,.dropIn,.dropL,.dropR").forEach(x => x.classList.remove("dropT", "dropB", "dropIn", "dropL", "dropR"));
$app.addEventListener("dragstart", e => { if (e.target.closest?.("[data-rz]")) return e.preventDefault(); const g = e.target.closest?.(".grip"); const th = e.target.closest?.("th[data-f]");
  if (g && S.sort) { e.preventDefault(); return toast("The table is sorted — clear the sort to move rows by hand"); }
  if (g) { const tr = g.closest("tr"); S.drag = { kind:"row", id: tr.dataset.id }; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", tr.dataset.id); try { e.dataTransfer.setDragImage(tr, 20, 14); } catch (_) {} }
  else if (th) { S.drag = { kind:"col", id: th.dataset.f }; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", th.dataset.f); } });
function dropTarget(e){ if (!S.drag) return null;
  if (S.drag.kind === "row") { const tr = e.target.closest("tr[data-id]"); if (!tr) return null; const src = S.row[S.drag.id], dst = S.row[tr.dataset.id]; if (!src || !dst || src.id === dst.id) return null;
    if (src.level === dst.level) { const b = tr.getBoundingClientRect(); return { tr, where: e.clientY < b.top + b.height / 2 ? "T" : "B", src, dst }; }
    if (S.row[src.parent_id]?.level === dst.level && dst.id !== src.parent_id) return { tr, where:"In", src, dst }; return null; }
  const th = e.target.closest("th[data-f]"); if (!th || th.dataset.f === S.drag.id) return null; const f = S.fields.find(x => x.id === th.dataset.f); if (!f || f.role === "title") return null;
  const b = th.getBoundingClientRect(); return { th, where: e.clientX < b.left + b.width / 2 ? "L" : "R", f }; }
$app.addEventListener("dragover", e => { const t = dropTarget(e); clearDrop(); if (!t) return; e.preventDefault(); e.dataTransfer.dropEffect = "move"; (t.tr || t.th).classList.add("drop" + t.where); });
$app.addEventListener("dragend", () => { S.drag = null; clearDrop(); });
$app.addEventListener("drop", e => { const t = dropTarget(e); const d = S.drag; S.drag = null; clearDrop(); if (!t) return; e.preventDefault();
  if (d.kind === "row") { const parent = t.where === "In" ? t.dst.id : t.dst.parent_id; const before = t.where === "T" ? t.dst.id : t.where === "B" ? (nextSibling(t.dst)?.id || null) : null;
    if (before === t.src.id) return; return moveRow(t.src, parent, before); }
  const i = S.fields.indexOf(t.f); const before = t.where === "L" ? t.f.id : (S.fields[i + 1]?.id || null); if (before === d.id) return;
  moveCol(d.id, before); });
boot();
</script>
