<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM-Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* PM-сетап look, spreadsheet layout: header, toolbar, cell bar, grid, status bar, sheet tabs at the bottom */
:root{
  --font-heading:"Barlow Condensed",system-ui,sans-serif; --font-body:"Barlow",system-ui,sans-serif; --font-mono:ui-monospace,Menlo,Consolas,monospace;
  --ink:#17324d; --ink-2:#1d4467; --text:#23303f; --text-2:#3f4a5c; --muted:#6b7689; --muted-2:#7b879a; --muted-3:#9aa6b6;
  --page:#eef2f8; --frame:#b8c3d4; --rule:#dfe6ef; --rule-2:#e6ebf2; --rule-3:#eef2f7; --band:#e4ebf4; --band-2:#eff3f8;
  --font-table:"Inter",system-ui,sans-serif; --fs:13px;
  --label-bg:#f2f5f9; --soft:#f7f9fc; --mark:#3d86c6; --honey:#8a6410; --teal:#10635f; --danger:#a8432f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--page);overflow:hidden}
body{font-family:var(--font-body);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:#2c5f8f;text-underline-offset:2px}
[hidden]{display:none!important}
::selection{background:#c5dff7}
#app{height:100%;display:flex;flex-direction:column}

/* header */
.hdr{flex:none;display:flex;align-items:center;gap:12px;height:40px;padding:0 14px;background:var(--ink);color:#dce6f2}
.brand{font-family:var(--font-heading);font-size:14px;font-weight:600;letter-spacing:.22em;color:#fff;padding-right:12px;border-right:1px solid #2f4b6b}
.hdr select{height:26px;background:#1d3d5c;color:#fff;border:1px solid #2f4b6b;border-radius:2px;padding:0 6px;font-weight:600}
.saved{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#8fa6c2}
.saved.busy{color:#f3d489}
.hdr .sp{flex:1}
.hdr .who{font-family:var(--font-mono);font-size:10.5px;color:#8fa6c2}
.hbtn{border:1px solid #2f4b6b;background:none;color:#dce6f2;border-radius:2px;height:24px;padding:0 8px;font-family:var(--font-heading);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.hbtn:hover{background:#1d3d5c}

/* menu row */
.mrow{flex:none;display:flex;align-items:center;gap:2px;height:26px;padding:0 8px;background:#fff;border-bottom:1px solid var(--rule-3)}
.mrow button{height:22px;padding:0 9px;border:0;background:none;border-radius:3px;font-size:12.5px;color:var(--text-2);cursor:pointer}
.mrow button:hover,.mrow button.open{background:var(--band-2);color:var(--ink)}
.menu button .hint{margin-left:auto;padding-left:18px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted-3)}
.tbtn.ico{padding:0 7px;font-size:14px;letter-spacing:0}
.split{display:inline-flex}.split .tbtn:first-child{border-radius:3px 0 0 3px;padding-right:6px}.split .tbtn:last-child{border-radius:0 3px 3px 0;padding:0 5px}
.grid tr.del td{text-decoration:line-through;color:var(--muted-3)!important;background:#fbf1ef!important}
.grid tr.del .chip{opacity:.4}
.grid tr.mv td:first-child{box-shadow:inset 3px 0 0 #e0a800}
.grid tr.nw td{background:#fbf6e6}.grid tr.nw td:first-child{box-shadow:inset 3px 0 0 #e0a800}
.grid th.fdr{box-shadow:inset 0 -2px 0 #e0a800;background:#fff8e6}
/* toolbar + cell bar */
.tb{flex:none;display:flex;align-items:center;gap:4px;height:38px;padding:0 10px;background:#fff;border-bottom:1px solid var(--rule)}
.tbtn{height:26px;padding:0 9px;border:1px solid transparent;background:none;border-radius:3px;font-family:var(--font-heading);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--band-2);border-color:var(--rule)}
.tbtn.pri{background:var(--ink);color:#fff}.tbtn.pri:hover{background:var(--ink-2)}
.tbtn:disabled{opacity:.4;cursor:default}
.tsep{width:1px;height:20px;background:var(--rule);margin:0 5px}
.tb .sp{flex:1}
.search{height:26px;width:200px;border:1px solid var(--rule);border-radius:3px;padding:0 8px;background:var(--soft)}
.search:focus,.cb input:focus{outline:2px solid var(--mark);outline-offset:-1px;background:#fff}
.cb{flex:none;display:flex;align-items:center;height:30px;background:#fff;border-bottom:1px solid var(--frame)}
.cb .ref{flex:none;width:300px;padding:0 12px;font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--rule)}
.cb input{flex:1;height:100%;border:0;padding:0 10px;background:none;min-width:0;font-family:var(--font-table)}
.cb .hint{padding:0 12px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted-3);white-space:nowrap}

/* grid */
.main{flex:1;min-height:0;overflow:auto;background:#fff;outline:none;position:relative}
.main>*{zoom:var(--zoom,1)}
table.grid{border-collapse:separate;border-spacing:0;min-width:100%}
.grid th{position:sticky;top:0;z-index:3;vertical-align:top;line-height:1.25;padding:calc(var(--fs) * .45) 8px;background:var(--label-bg);border-bottom:1px solid var(--frame);border-right:1px solid var(--rule);text-align:left;font-family:var(--font-table);font-size:calc(var(--fs) - 2px);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);white-space:nowrap;user-select:none}
.grid th:first-child{left:0;z-index:5}
.thc{display:flex;align-items:flex-start;gap:4px}
.thn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid th.wrap .thn{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:break-word}
.grid th .hm{flex:none;border:0;background:none;color:var(--muted-3);cursor:pointer;padding:0 2px;line-height:inherit;font-size:inherit;border-radius:2px}
.grid th:hover .hm,.grid th .hm:hover{color:var(--ink);background:var(--band)}
.grid th .hmk{flex:none;font-size:.82em;color:var(--mark)}
.grid th.flt{background:#e3eefa}
.grid td.dtc{white-space:nowrap;font-family:var(--font-mono);font-size:.92em}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2);white-space:nowrap;cursor:pointer}
.fnote{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:6px} .fnote b{color:var(--ink)}
.lnk{border:0;background:none;padding:0;color:var(--mark);cursor:pointer;font-size:12px;text-decoration:underline}
.fpop{min-width:230px;max-width:340px}
.fpop .fph{display:flex;gap:4px;padding:2px 6px 6px}.fpop .fph button{width:auto;flex:1;text-align:center;border:1px solid var(--rule);border-radius:3px;padding:3px 6px}
.fpop .fpl{max-height:320px;overflow:auto;border-top:1px solid var(--rule-2);padding:4px 0}
.fpop label{display:flex;align-items:center;gap:8px;padding:4px 10px;font-size:12.5px;cursor:pointer}.fpop label:hover{background:var(--band)}
.fpop .fv{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fpop .n{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-3)}
.modal.wide{width:min(980px,94vw)}
.sec{display:flex;align-items:center;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--frame)}.sec:first-child{margin-top:0}
.shd{margin-left:auto;display:grid;grid-template-columns:86px 86px 132px 250px;gap:8px;text-align:left}
.lvls{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.lvls .arr{color:var(--muted-3)}
.lvl{display:flex;align-items:center;gap:5px;border:1px solid var(--rule);border-radius:3px;padding:3px 7px;background:var(--label-bg);opacity:.75}.lvl.on{background:#fff;opacity:1;border-color:var(--frame)}
.lvl .ln{width:92px;height:24px;font:inherit;font-size:13px;color:var(--ink);border:1px solid transparent;background:none;padding:0 4px;border-radius:2px}.lvl .ln:hover{border-color:var(--rule)}.lvl .ln:focus{outline:2px solid var(--mark);background:#fff}
.lvl .n{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-3);min-width:14px;text-align:right}
.srow{display:grid;grid-template-columns:76px minmax(120px,1fr) 86px 86px 132px 170px 30px 30px;gap:8px;align-items:center;min-height:34px;border-bottom:1px solid var(--rule-2)}
.srow.del{opacity:.55}.srow.del .sn{text-decoration:line-through}.srow.del{grid-template-columns:76px minmax(120px,1fr) 86px 86px 132px 170px 68px}
.srow .slv{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-3);overflow:hidden;text-overflow:ellipsis}
.srow .sn,.srow .sdl{font:inherit;font-size:13px;color:var(--ink);height:26px;border:1px solid transparent;background:none;padding:0 6px;border-radius:3px;min-width:0;width:100%}.srow .sn{font-weight:600}
.srow .sn:hover,.srow .sdl:hover{border-color:var(--rule)}.srow .sn:focus,.srow .sdl:focus{outline:2px solid var(--mark);background:#fff}
.srow .sd{font-family:var(--font-mono);font-size:11.5px;color:var(--text-2)}.srow .sd.late{color:#b5483a;font-weight:600}.srow .sh{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sadd{padding:6px 0 8px}
.chg{position:fixed;right:0;top:104px;bottom:62px;width:360px;max-width:92vw;background:#fff;border-left:1px solid var(--frame);box-shadow:-8px 0 24px rgba(20,40,70,0);z-index:40;display:flex;flex-direction:column;
  transform:translateX(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1),box-shadow .26s ease}
.chg.open{transform:none;box-shadow:-8px 0 24px rgba(20,40,70,.12)}
/* motion: everything appears and leaves smoothly; people who asked their system for less motion get none */
@keyframes pmFadeIn{from{opacity:0}} @keyframes pmFadeOut{to{opacity:0}}
@keyframes pmPop{from{opacity:0;transform:translateY(10px) scale(.985)}} @keyframes pmDrop{from{opacity:0;transform:translateY(-4px)}}
@keyframes pmToastIn{from{opacity:0;transform:translate(-50%,10px)}} @keyframes pmToastOut{to{opacity:0;transform:translate(-50%,6px)}}
.veil{animation:pmFadeIn .14s ease-out}.veil>.modal{animation:pmPop .2s cubic-bezier(.2,.8,.2,1)}
.veil-out{position:fixed;inset:0;z-index:50;background:rgba(23,50,77,.32);display:flex;align-items:center;justify-content:center;padding:20px;animation:pmFadeOut .14s ease-in forwards;pointer-events:none}
.menu{animation:pmDrop .12s ease-out}
.toast{animation:pmToastIn .2s cubic-bezier(.2,.8,.2,1)}
.toast-out.bad{background:var(--danger)}
.toast-out{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);max-width:min(560px,92vw);background:var(--ink);color:#fff;padding:9px 14px;border-radius:3px;font-size:12.5px;z-index:70;animation:pmToastOut .2s ease-in forwards;pointer-events:none}
.tbtn,.ib,.hbtn,.chgi{transition:background-color .12s ease,color .12s ease,border-color .12s ease}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.chgh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule);font-size:13px}.chgh .n{font-family:var(--font-mono);font-size:11px;background:#fff1cc;color:var(--honey);border-radius:9px;padding:1px 7px}
.chgh .sp,.hkbar .sp{flex:1}
.chgh{padding-right:10px!important}.chgh .ib{width:24px;height:24px}
.chgl{flex:1;overflow:auto}.chgi{display:flex;align-items:flex-start;gap:8px;padding:8px 10px 8px 12px;border-bottom:1px solid var(--rule-2);cursor:pointer}.chgi:hover{background:var(--band)}
.chgi .ck{flex:none;width:62px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--honey);padding-top:2px}
.chgi .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:12.5px}.chgi .ct b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chgi .ct span{color:var(--muted);font-size:12px;word-break:break-word}
.chgi .ib{flex:none;width:24px;height:24px;font-size:14px;line-height:1;opacity:.6}.chgi:hover .ib{opacity:1}.chgi .ib:hover{color:var(--mark);border-color:var(--mark)}
.chgi.off{cursor:default;background:var(--soft)}.chgi.off .ct b,.chgi.off .ct span{text-decoration:line-through;color:var(--muted-3)}.chgi.off .ck{color:var(--muted-3)}.chgi.off .ib{opacity:1;color:var(--mark)}
.chgh .n.off{background:var(--band);color:var(--muted)}
.chgf{padding:8px 12px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--muted)}
.tbtn.on{background:var(--band-2)}
.keyhelp{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:4px 26px}
.kcol .sec{margin-top:6px}.krow{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:12.5px;border-bottom:1px solid var(--rule-2)}
.kk{white-space:nowrap;color:var(--muted)}kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:1px 5px;background:var(--label-bg);color:var(--ink)}
.prefs{width:min(900px,94vw)}.pbody{display:flex;min-height:420px;overflow:hidden}.pnav{display:flex;flex-direction:column;gap:2px;padding:12px 8px;border-right:1px solid var(--rule);min-width:150px;background:var(--label-bg)}
.pnav button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:3px;cursor:pointer;font-size:13px;color:var(--text-2)}.pnav button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--mark)}
.pbody .mbody{flex:1;overflow:auto}.prow{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid var(--rule-2);font-size:13px}.prow>span:first-child{min-width:110px;color:var(--text-2)}
.prow input[type=password]{height:30px;border:1px solid var(--frame);border-radius:3px;padding:0 8px}.prow select{height:30px}
.chk2{align-items:flex-start;cursor:pointer}.chk2>span:first-child{min-width:0!important}
.hkbar{display:flex;gap:8px;margin-bottom:8px}.hkbar input{height:30px;border:1px solid var(--frame);border-radius:3px;padding:0 9px;width:280px}
table.hk td{vertical-align:middle}table.hk tr.rec td{background:#fff8e6}.recn{color:var(--honey);font-weight:600}
.grid th.dropL{box-shadow:inset 3px 0 0 var(--mark)} .grid th.dropR{box-shadow:inset -3px 0 0 var(--mark)}
.grid th.virt{}
.grid th{position:sticky}
.rz{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:6}
.rz:hover,.rz.on{background:var(--mark);opacity:.5}
.grid td{height:calc(var(--fs) * 2.15);font-family:var(--font-table);font-size:var(--fs);padding:0 8px;border-bottom:1px solid var(--rule-2);border-right:1px solid var(--rule-3);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis;cursor:cell;background:#fff}
.grid td:first-child{position:sticky;left:0;z-index:2;max-width:none;border-right:1px solid var(--frame);min-width:120px}
.grid td:first-child .tc{min-width:0} .grid td:first-child .ttl{overflow:hidden;text-overflow:clip;white-space:nowrap}
.grid tr.d0 td{background:var(--band-2);font-weight:600;color:var(--ink)}
.grid tr.d1 td{font-weight:500}
.grid tr.dim td{color:var(--muted-3);background:#f6f8fa;font-weight:400}
.grid tr.dim .chip{opacity:.55} .grid tr.dim a{color:var(--muted-3)}
.grid td.sel{outline:2px solid var(--mark);outline-offset:-2px;z-index:1;position:relative}
.grid tr.rsel td{background:#e6f0fa!important;box-shadow:inset 0 2px 0 var(--mark),inset 0 -2px 0 var(--mark)}.grid tr.rsel td:first-child{box-shadow:inset 3px 0 0 var(--mark),inset 0 2px 0 var(--mark),inset 0 -2px 0 var(--mark)}
/* a run of picked rows is one block: no line between neighbours, only around the whole run */
.grid tr.rsel + tr.rsel td{box-shadow:inset 0 -2px 0 var(--mark)} .grid tr.rsel + tr.rsel td:first-child{box-shadow:inset 3px 0 0 var(--mark),inset 0 -2px 0 var(--mark)}
.grid tr.rsel:has(+ tr.rsel) td{box-shadow:inset 0 2px 0 var(--mark)} .grid tr.rsel:has(+ tr.rsel) td:first-child{box-shadow:inset 3px 0 0 var(--mark),inset 0 2px 0 var(--mark)}
.grid tr.rsel + tr.rsel:has(+ tr.rsel) td{box-shadow:none} .grid tr.rsel + tr.rsel:has(+ tr.rsel) td:first-child{box-shadow:inset 3px 0 0 var(--mark)}
.grid td:first-child.sel{position:sticky;z-index:2}
.grid td.num{text-align:right;font-variant-numeric:tabular-nums}
.grid td.sum{color:var(--muted)}
.grid td.ok2{background:#e7f4f1!important}
.grid td.ctr{text-align:center}
.grid tr.dropT td{box-shadow:inset 0 2px 0 var(--mark)} .grid tr.dropB td{box-shadow:inset 0 -2px 0 var(--mark)} .grid tr.dropIn td{box-shadow:inset 0 0 0 2px var(--mark)}
.grid tr.hit td:first-child{box-shadow:inset 3px 0 0 #e0a800}
.tc{display:flex;align-items:center;gap:5px;height:100%}
.grip{flex:none;width:10px;color:var(--muted-3);cursor:grab;font-size:10px;visibility:hidden;line-height:1}
tr:hover .grip{visibility:visible}
.caret{flex:none;width:14px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:9px;padding:0}
.caret.leaf{visibility:hidden}
.lvl{flex:none;font-family:var(--font-mono);font-size:calc(var(--fs) - 4.5px);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);border:1px solid var(--rule);border-radius:2px;padding:1px 3px;background:#fff;font-weight:400}
.ttl{overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;padding:1px 7px;border-radius:9px;font-size:calc(var(--fs) - 1.5px);font-weight:500;line-height:calc(var(--fs) + 3px);color:var(--c,#5980a6);background:color-mix(in srgb,var(--c,#5980a6) 13%,#fff);border:1px solid color-mix(in srgb,var(--c,#5980a6) 30%,#fff)}
.box{display:inline-block;width:14px;height:14px;border:1.5px solid var(--rule);border-radius:2px;vertical-align:middle;position:relative;background:#fff}
tr:hover .box,td.sel .box{border-color:var(--frame)}
.box.on,tr:hover .box.on{background:var(--teal);border-color:var(--teal)}
.prog{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.prog i{display:block;width:44px;height:5px;border-radius:3px;background:var(--rule);overflow:hidden}
.prog i b{display:block;height:100%;background:var(--teal)}
.fbtn.on{background:#e3eefa;border-color:#b9d3ee;color:var(--ink)}
.wl td.h{text-align:center;font-family:var(--font-mono);font-size:11px;padding:0;min-width:26px;width:26px;cursor:default}
.wl td.we,.wl th.we{background:#eef1f5!important;color:var(--muted-3)}
.wl td.full{background:#d9ebf8} .wl td.part{background:#eef6fc} .wl td.free{color:var(--muted-3)}
.wl th.d{padding:0;text-align:center;min-width:26px;width:26px;line-height:1.2;height:40px;letter-spacing:0}
.box.on::after{content:"";position:absolute;left:3.5px;top:.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.over{color:var(--danger);font-weight:600}.under{color:var(--teal)}
.edit{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0 8px;font:inherit;background:#fff;outline:2px solid var(--mark);outline-offset:-2px}
td.editing{position:relative;padding:0!important;overflow:visible}
td:first-child.editing{position:sticky}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* status bar + sheet tabs */
.stat{flex:none;display:flex;align-items:center;height:26px;background:var(--label-bg);border-top:1px solid var(--frame);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat div{padding:0 14px;border-right:1px solid var(--rule);white-space:nowrap}
.stat b{font-size:12px;color:var(--ink);letter-spacing:0;margin-left:5px}
.stat .sp{flex:1;border:0;padding:0}
.stat .vw{display:flex;align-items:center;gap:6px;border-right:0;border-left:1px solid var(--rule);text-transform:none;letter-spacing:0}

.stat .vw.seg button:first-child{border-radius:3px 0 0 3px} .stat .vw.seg button:last-child{border-radius:0 3px 3px 0;border-left:0}
.stat .vw.seg button.lock{margin-left:4px;border-radius:3px!important;border-left:1px solid var(--rule)!important;padding:0 6px;font-size:11px;filter:grayscale(1);opacity:.6} .stat .vw.seg button.lock.on{background:#fff;color:var(--ink-2);border-color:var(--ink-2)!important;filter:none;opacity:1}
.stat .vw.seg button.on{background:var(--ink-2);color:#fff;border-color:var(--ink-2)}
.stat .vw button:hover{background:var(--band-2)} .stat .vw button:disabled{opacity:.4;cursor:default}
.stat .vw input[type=range]{width:110px;accent-color:var(--ink-2)}
.stat .vw .val{min-width:38px;text-align:right;color:var(--ink);font-size:11.5px}
.tabs{flex:none;display:flex;align-items:stretch;height:32px;background:var(--band);border-top:1px solid var(--frame);padding-left:8px}
.tab{display:flex;align-items:center;padding:0 16px;border:0;border-right:1px solid var(--frame);background:none;font-family:var(--font-heading);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer}

.tab:hover{background:var(--band-2);color:var(--ink)}
.tab[aria-current=page]{background:#fff;color:var(--ink);box-shadow:inset 0 -3px 0 #7fd4d2;margin-top:-1px}
.tabs .soon{display:flex;align-items:center;padding:0 12px;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-3);white-space:nowrap}

/* menu, modal, toast */
.menu{position:fixed;z-index:60;min-width:190px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--frame);border-radius:4px;box-shadow:0 12px 32px rgba(23,50,77,.18);padding:4px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:6px 10px;border-radius:3px;cursor:pointer;font-size:12.5px}
.menu button:hover,.menu button:focus{background:var(--band-2);outline:none}
.menu button.danger{color:var(--danger)} .menu button:disabled{color:var(--muted-3);cursor:default;background:none}
.menu hr{border:0;border-top:1px solid var(--rule);margin:4px 0}
.menu .mh{padding:4px 10px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-3)}
.menu form{padding:8px;display:flex;flex-direction:column;gap:6px;width:260px}
.menu form input{height:28px;border:1px solid var(--frame);border-radius:3px;padding:0 8px}
.veil{position:fixed;inset:0;z-index:50;background:rgba(23,50,77,.32);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{position:relative;width:min(720px,100%);max-height:86vh;display:flex;flex-direction:column;background:#fff;border:1px solid var(--frame)}
.modal::before,.modal::after{content:"+";position:absolute;font-family:var(--font-mono);font-size:11px;line-height:1;color:var(--mark)}
.modal::before{left:-4px;top:-6px}.modal::after{right:-4px;top:-6px}
.mhead{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;background:var(--band);border-bottom:1px solid var(--frame)}
.mhead .t{font-family:var(--font-heading);font-size:16px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.mhead .sp{flex:1}
.mtabs{display:flex;gap:2px;padding:8px 14px 0;border-bottom:1px solid var(--rule)}
.mtabs button{border:0;background:none;padding:6px 12px;font-family:var(--font-heading);font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.mtabs button.on{color:var(--ink);border-bottom-color:#7fd4d2}
.mbody{padding:14px;overflow:auto}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--rule);background:var(--soft)}
.orow{display:flex;align-items:center;gap:6px;padding:3px 0}
.orow input[type=text]{flex:1;height:28px;border:1px solid var(--rule);border-radius:3px;padding:0 8px}
.orow input[type=color]{width:30px;height:28px;border:1px solid var(--rule);border-radius:3px;padding:1px;background:#fff}
.orow label{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
.orow .ck,.ohead .ck{width:38px;justify-content:center;text-align:center}
.orow .tint,.ohead .tint{width:148px;display:flex;align-items:center;gap:5px}
.orow .tint i{width:14px;height:14px;border-radius:3px;border:1px solid var(--rule);flex:none}
.orow .tint select{flex:1;height:26px;border:1px solid var(--rule);border-radius:3px;background:#fff;font-size:12px}
.ohead{display:flex;align-items:center;gap:6px;font:600 10.5px var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 0 4px}
.ohead .g{flex:1;text-align:right;padding-right:4px;text-transform:none;letter-spacing:0;font-weight:500}
.grid tr.t-red td{background:#fbe3e0} .grid tr.t-dark td{background:#d9dde3} .grid tr.t-amber td{background:#fbf0d6}
.grid tr.t-green td{background:#e1f2e7} .grid tr.t-blue td{background:#e2ecf9} .grid tr.t-violet td{background:#ece5f8}
.grid td.dd{position:relative;padding-right:18px}
.grid td.dd::after{content:"▾";position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--muted-3);opacity:.35;pointer-events:none;transition:opacity .12s,color .12s}
.grid tr:hover td.dd::after{opacity:.9} .grid td.dd.sel::after{opacity:1;color:var(--ink-2)}
.grid td.dd.editing::after{display:none}
.grid td.csel{background:#e6f0fa!important;box-shadow:inset 0 0 0 1px #9cc0e6}
.stat .vw.pick{font:600 10.5px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.blv{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 12px;margin:0 0 6px;border:1px solid var(--rule);border-radius:4px;background:#fff;cursor:pointer;font:inherit;transition:background .15s,border-color .15s}
.blv:hover,.blv:focus{background:var(--band-2);border-color:var(--ink-2);outline:none} .blv span{font-family:var(--font-mono);color:var(--muted)}
.blist{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow:auto}
.brow{display:grid;grid-template-columns:22px 150px 1fr;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;border:1px solid transparent;transition:background .15s,border-color .15s;cursor:pointer}
.brow.on{background:#eef4fb;border-color:#cfe0f3} .brow .bn{font-size:13px} .brow:not(.on) .bn{color:var(--muted)}
.brow select,.brow input:not([type=checkbox]){height:30px;border:1px solid var(--rule);border-radius:3px;padding:0 8px;background:#fff;font:inherit;font-size:13px;min-width:0}
/* the row's own colour, used by the fade at the right edge of a too-narrow cell */
.grid tr{--rb:#fff} .grid tr.dim{--rb:#f6f8fa} .grid tr.t-red{--rb:#fbe3e0} .grid tr.t-dark{--rb:#d9dde3} .grid tr.t-amber{--rb:#fbf0d6} .grid tr.t-green{--rb:#e1f2e7} .grid tr.t-blue{--rb:#e2ecf9} .grid tr.t-violet{--rb:#ece5f8}
.grid tr.nw{--rb:#fbf6e6} .grid tr.rsel{--rb:#e6f0fa} .grid td.csel{--rb:#e6f0fa}
.grid td.ov{text-overflow:clip} .grid td.ov:not(:first-child){position:relative}
.grid td.ov::before{content:"";position:absolute;top:0;bottom:0;right:0;width:34px;background:linear-gradient(to right,transparent,var(--rb) 75%);pointer-events:none;z-index:1}
.grid td.dd::after{z-index:2}
.grid .box.addlnk{display:inline-flex;width:auto;height:auto;padding:1px 7px;border:1px dashed var(--rule);border-radius:3px;font-size:11px;color:var(--muted-3);background:transparent;cursor:pointer;opacity:0;transition:opacity .15s}
.grid tr:hover .box.addlnk,.grid td.sel .box.addlnk{opacity:1} .grid .box.addlnk:hover{color:var(--ink-2);border-color:var(--ink-2)}
.grid .wlc{cursor:pointer;border-bottom:1px dotted var(--muted-3)}
/* row tools: pinned to the right edge of the window, slides open */
.grid th.rt,.grid td.rt{position:sticky;right:0;z-index:3;width:18px;min-width:18px;max-width:18px;padding:0;border-left:1px solid var(--frame);transition:width .22s ease,min-width .22s ease,max-width .22s ease;text-align:center;overflow:hidden}
.grid td.rt{background:var(--rb)} .grid th.rt{z-index:6}
.grid.rto th.rt,.grid.rto td.rt{width:112px;min-width:112px;max-width:112px}
.grid th.rt button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:13px;width:100%;height:100%}
.grid td.rt .rtb{display:inline-flex;gap:2px;opacity:0;transition:opacity .15s} .grid.rto tr:hover td.rt .rtb,.grid.rto tr.rsel td.rt .rtb{opacity:1}
.grid:not(.rto) td.rt .rtb{display:none}
.grid td.rt button{width:24px;height:22px;border:1px solid var(--rule);border-radius:3px;background:#fff;cursor:pointer;font-size:12px;color:var(--ink-2);padding:0}
.grid td.rt button:hover{background:var(--band-2)} .grid td.rt button[data-act=rt-del]:hover{color:#b5483a;border-color:#b5483a}
.warnbar{display:flex;align-items:center;gap:12px;padding:6px 14px;background:#fff7e3;border-top:1px solid #ecd9a6;font-size:12px;color:#6b5414;animation:slidein .22s ease}
.warnbar>b{white-space:nowrap} .warnbar .note{white-space:nowrap;margin:0} .warnbar .lnk{color:#6b5414;text-decoration:underline dotted;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px} .warnbar .sp{flex:1}
@keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.wlf{display:grid;grid-template-columns:136px 140px 76px minmax(160px,1fr) auto;gap:6px;margin:0 0 12px}.wlf input,.wlf select{height:30px;border:1px solid var(--rule);border-radius:3px;padding:0 8px;font:inherit;font-size:13px;min-width:0}
.wlt td,.wlt th{padding:6px 8px;font-size:13px} .wlt tr.nw td{background:#fbf6e6} .wlt tfoot td{border-top:1px solid var(--frame)}
.orow.pp input[type=text]{flex:1} .orow.pp.nw{background:#fbf6e6;border-radius:4px}
.grid .man{margin-left:4px;font-size:11px;color:var(--muted);cursor:help}
.orow .n{width:20px;text-align:right;font-family:var(--font-mono);font-size:10.5px;color:var(--muted-3)}
.ib{width:26px;height:26px;border:1px solid var(--rule);background:#fff;border-radius:3px;cursor:pointer;color:var(--muted)}
.ib:hover{background:var(--band-2);color:var(--ink)} .ib:disabled{opacity:.35;cursor:default}
.note{font-size:11.5px;color:var(--muted);line-height:1.5;margin:10px 0 0}
.note b{color:var(--text-2)}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);max-width:min(560px,92vw);background:var(--ink);color:#fff;padding:9px 14px;border-radius:3px;font-size:12.5px;z-index:70;box-shadow:0 12px 32px rgba(23,50,77,.25)}
.toast.bad{background:var(--danger)}

/* plain sheets (pipelines, history) */
.pad{padding:18px 20px 40px;display:flex;flex-direction:column;gap:14px}
.panel{position:relative;background:#fff;border:1px solid var(--frame)}
.bar{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;background:var(--band);border-bottom:1px solid var(--frame)}
.bar .t{font-family:var(--font-heading);font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.bar .n{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)} .bar .sp{flex:1}
table.plain{border-collapse:collapse;width:100%}
.plain th{height:28px;padding:0 9px;background:var(--label-bg);border-bottom:1px solid var(--frame);text-align:left;font-family:var(--font-mono);font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.plain td{height:30px;padding:0 9px;border-bottom:1px solid var(--rule-2)}
.plain input,.plain select{height:26px;border:1px solid transparent;background:none;padding:0 6px;width:100%;border-radius:3px}
.plain input:hover,.plain select:hover{border-color:var(--rule)} .plain input:focus,.plain select:focus{outline:2px solid var(--mark);background:#fff}
.dchips{display:flex;flex-wrap:wrap;gap:4px}
.dchip{border:1px solid var(--rule);background:#fff;border-radius:3px;padding:1px 7px;font-size:11.5px;color:var(--muted);cursor:pointer}
.dchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:var(--soft)}
.form input{height:26px;border:1px solid var(--frame);border-radius:3px;padding:0 7px}
.form label{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tag{display:inline-block;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;padding:2px 6px;border-radius:2px;background:var(--band);color:var(--ink-2);white-space:nowrap}
.tag.warn{background:#f6ecd4;color:var(--honey)} .tag.off{background:var(--rule-3);color:var(--muted-3)}

/* gantt */
.gwrap{display:grid;min-width:max-content}
.gh{position:sticky;top:0;z-index:4;display:flex;background:var(--label-bg);border-bottom:1px solid var(--frame)}
.gname{position:sticky;left:0;z-index:3;flex:none;width:330px;font-family:var(--font-table);background:#fff;border-right:1px solid var(--frame);display:flex;align-items:center;gap:6px;padding:0 8px;height:26px;overflow:hidden;white-space:nowrap}
.gh .gname{background:var(--label-bg);z-index:6;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);height:40px}
.gdays{display:flex}
.gd{flex:none;width:26px;height:40px;border-right:1px solid var(--rule-3);font-family:var(--font-mono);font-size:9.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.gd.we{background:#e9edf3;color:var(--muted-3)} .gd.mo{border-left:1px solid var(--frame)}
.gr{display:flex;border-bottom:1px solid var(--rule-2)}
.gr.d0 .gname{background:var(--band-2);font-weight:600;color:var(--ink)} .gr.d0 .gtrack{background-color:var(--band-2)}
.gtrack{position:relative;height:26px;flex:none;background-image:linear-gradient(to right,transparent 25px,var(--rule-3) 25px);background-size:26px 100%}
.gwe{position:absolute;top:0;bottom:0;width:26px;background:rgba(160,172,190,.2)}
.gbar{position:absolute;top:5px;height:16px;border-radius:3px;background:var(--c,#5980a6);color:#fff;font-size:10px;line-height:16px;padding:0 5px;overflow:hidden;white-space:nowrap}
.gbar.span{top:8px;height:10px;background:var(--ink);opacity:.5;padding:0;border-radius:2px}
.gbar.span:hover{opacity:.8}
.gbar.gap{background:repeating-linear-gradient(135deg,#c9b06a 0 4px,#efe2b6 4px 8px);color:#5d4708}
.gdone{position:absolute;left:6px;top:5px;font-family:var(--font-mono);font-size:10px;color:var(--muted-3)}
.gbar[data-bar]{cursor:grab;touch-action:none;user-select:none}
.gbar.bad{outline:2px solid var(--danger);outline-offset:1px}
.gbar.dr{box-shadow:0 0 0 2px #e0a800}
.gbar.old{opacity:.35}
.gwrap{position:relative}
.gnow{position:absolute;top:0;bottom:0;border-left:2px solid #e0a800;z-index:2;pointer-events:none}
.tag.bad{background:#f6d5cf;color:var(--danger)} .tag.ok{background:#dcefee;color:var(--teal)}
.kick{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stepsel{height:26px;border:1px solid var(--rule);border-radius:3px;background:#fff;padding:0 4px}
.grid td.dr{background:#fff8e6!important;box-shadow:inset 0 -2px 0 #e0a800}
.wl td.overb{background:#f6d5cf;color:var(--danger);font-weight:700}
.saved.draft{color:#f3d489}
.glegend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:0 12px;font-size:11.5px;color:var(--muted)}
.glegend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* login */
.login{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.login form{position:relative;width:340px;padding:26px 24px 22px;display:flex;flex-direction:column;gap:12px;background:#fff;border:1px solid var(--frame)}
.login h1{margin:6px 0 0;font-family:var(--font-heading);font-size:34px;line-height:.9;font-weight:600;text-transform:uppercase;color:var(--ink)}
.kicker{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2)}
.login input{height:32px;border:1px solid var(--frame);border-radius:2px;padding:0 9px;width:100%}

.err{color:var(--danger);font-size:12px;min-height:16px}
/* ---------- Roadmap — the look of the Stage Gantt artifact (PM-сетап 4a "Day field") ---------- */
.rmv{--frame:#aebbd0;--hair:#e2e9f2;--hair2:#cfd8e6;--head:#24486e;--head-fg:#dfeaf7;--head-rule:#35648f;--phead:#e6ecf5;--title:#17324d;--strip:#f6f9fd;--group:#d8e6f4;--alt:#f6f9fd;--ink:#23303f;--muted:#5d6b7d;--accent:#3d86c6;--accent-d:#2c5f8f;
  --alarm:#ffe0d9;--alarm-bd:#e8a294;--alarm-fg:#a83a26;--save-fg:#0d514e;--fb:"Barlow","Segoe UI",system-ui,sans-serif;--fh:"Barlow Condensed","Arial Narrow",sans-serif;--fm:ui-monospace,Menlo,Consolas,monospace;
  background:#eef2f8;color:var(--ink);font:14px/1.4 var(--fb);display:flex;flex-direction:column;overflow:hidden}
.rmv .btn{border:1px solid var(--hair2);background:#fff;color:var(--ink);padding:5px 11px;font:500 13px var(--fb);white-space:nowrap;border-radius:0;cursor:pointer;transition:background .15s,border-color .15s}
.rmv .btn:hover{border-color:var(--frame);background:var(--strip)} .rmv .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .rmv .btn.danger{color:var(--alarm-fg)}
.rmtop{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--phead);border-bottom:1px solid var(--frame);flex:none;flex-wrap:wrap}
.rmtop .sp{flex:1} .rmdraft{display:flex;align-items:center;gap:4px} .rmsep{width:1px;height:24px;background:var(--frame);margin:0 4px}
.rmtabs{display:flex;gap:4px;flex-wrap:wrap}
.rmsc{border:1px solid var(--hair2);background:#fff;padding:5px 12px;font:600 13px var(--fh);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-radius:0;transition:background .15s,color .15s}
.rmsc.on{background:var(--head);border-color:var(--head);color:#fff} .rmsc.add{border-style:dashed;color:var(--accent-d);text-transform:none;letter-spacing:0;font:600 12.5px var(--fb)}
.rmz{display:flex;align-items:center;gap:6px;font:11px var(--fm);color:var(--muted);text-transform:uppercase;letter-spacing:.08em} .rmz input{width:72px;accent-color:var(--accent)}
.rmdata{background:#fff;border-bottom:1px solid var(--frame);flex:none;max-height:42vh;overflow:auto;animation:rmdown .22s ease}
@keyframes rmdown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.rmv .settings{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;padding:10px 14px;background:var(--strip);border-bottom:1px solid var(--frame)}
.rmv .field{display:flex;flex-direction:column;gap:3px} .rmv .field label{font:500 10px var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rmv .field input,.rmv .field select{height:30px;border:1px solid var(--hair2);padding:0 8px;background:#fff;border-radius:0;font:inherit}
.rmv .field input[type=number]{width:90px} .rmcnt{display:flex;gap:4px} .rmcnt input:last-child{width:130px!important}
.rmv .seg{display:inline-flex;border:1px solid var(--hair2);background:#fff;margin-left:auto} .rmv .seg button{border:0;background:#fff;padding:6px 12px;font:600 12.5px var(--fb);cursor:pointer}

async function loadProjects(){

async function loadProject(){
  const p = S.project;

  S.view = (await q(sb.from("view").select("*").eq("table_id", S.tbl.id).eq("kind", "grid").is("deleted_at", null).order("position")))[0];

    q(sb.from("field").select("*").eq("table_id", S.tbl.id).is("deleted_at", null).order("position")),
    q(sb.from("view_field").select("*").eq("view_id", S.view.id).order("position")),

  const sids = stages.map(s => s.id);
  const deps = sids.length ? await q(sb.from("pipeline_stage_dep").select("*").in("stage_id", sids)) : [];

  deriveSchema();
  await loadTree(); loadTV(); S.rmBase = null; await rmLoad();
}
async function loadTree(){
  S.base = await q(sb.rpc("get_tree", { p_table: S.tbl.id }));

}
async function loadPlanData(){
  const ids = S.base.map(r => r.id); const deps = [], segs = [], wls = [];
  for (let i = 0; i < ids.length; i += 80) { const part = ids.slice(i, i + 80);

    segs.push(...await q(sb.from("segment").select("id,record_id,kind,gap_type,hours,start_at,end_at,assignee_id,version").in("record_id", part)));
    wls.push(...await q(sb.from("worklog").select("id,record_id,member_id,day,hours,note").in("record_id", part))); }
  S.wlBase = wls.map(w => ({ ...w, hours: +w.hours }));
  S.depsBase = {}; for (const d of deps) (S.depsBase[d.record_id] ||= []).push(d.depends_on_id);
  S.gapBase = {}; S.segs = {}; S.segAll = {};
  for (const g of segs) { if (g.kind === "gap") { S.gapBase[g.record_id] = { hours: +g.hours || 0, type: g.gap_type }; continue; }
    S.segAll[g.record_id] = g; if (g.start_at && g.end_at) S.segs[g.record_id] = { record: g.record_id, start: whOfIso(g.start_at), end: whOfIso(g.end_at), hours: +g.hours, assignee: g.assignee_id, version: g.version }; }
}
/* the draft lives in the browser until Apply; it survives a reload */
const draftKey = () => "pmkit.draft." + S.project?.id;
function saveDraft(){ try { localStorage.setItem(draftKey(), JSON.stringify(S.draft.ops)); localStorage.setItem(draftKey() + ".off", JSON.stringify(S.draft.parked || [])); } catch (_) {} if (PREF.autoApply && S.draft.ops.length) scheduleAuto(); }
function loadDraft(){ if (S.draft.project !== S.project.id) { S.draft = { ops:[], parked:[], undo:[], redo:[], project:S.project.id }; try { S.draft.ops = JSON.parse(localStorage.getItem(draftKey()) || "[]"); S.draft.parked = JSON.parse(localStorage.getItem(draftKey() + ".off") || "[]"); } catch (_) {} }
  const ids = new Set(S.base.map(r => r.id)), fids = new Set(S.raw.fields.map(f => f.id)), keep = [];

    if (o.t === "rows") { if (o.pipe && !ids.has(o.pipe.record)) continue; if (o.rows.some(x => x.parent && !ids.has(x.parent) && !o.rows.some(y => y.id === x.parent))) continue; o.rows.forEach(x => ids.add(x.id)); keep.push(o); continue; }

    if (o.t === "cell" && !fids.has(o.field)) continue;

  for (const o of ops) if (o.t === "rows") for (const x of o.rows) { const p = x.parent && S.row[x.parent]; if (!p || extra.some(e => e.record === p.id)) continue;
    const hadKids = S.tree.some(c => c.parent_id === p.id && !c._del); const raw = p._stMan || (!hadKids && p.data?.[st.id] != null);
    if (!hadKids && raw) { const base = S.base.find(r => r.id === p.id)?.data?.[st.id] ?? null; S.draft.ops = S.draft.ops.filter(c => !(c.t === "cell" && c.record === p.id && c.field === st.id));
      if (base != null) extra.push({ t:"cell", record:p.id, field:st.id, value:null, base }); } }
  return [...ops, ...extra]; }
function pushOps(ops, msg){ if (!ops.length) return; draftPush(); ops = freeParents(ops); S.draft.ops.push(...ops); saveDraft(); rebuild(); render(); if (msg) toast(msg); }
const uid = () => crypto.randomUUID();
/* what the table, columns, levels and pipelines look like = database + the draft on top */
/* people with the draft on top: added, renamed, given a lead, removed */

    const m = all.find(x => x.id === o.id); if (!m) continue; if (o.name) m.display_name = o.name; if ("lead" in o) m.lead_id = o.lead || null; if (o.remove) m.removed_at = "draft"; }
  S.allMembers = all; S.members = S.allMembers.filter(m => !m.removed_at); }

  const place = (id, before) => { const i = order.indexOf(id); if (i >= 0) order.splice(i, 1); const k = before ? order.indexOf(before) : -1; if (k < 0) order.push(id); else order.splice(k, 0, id); };
  const removed = new Set(S.view.config?.removed || []); const pls = R.pipelines.map(x => ({ ...x })), sts = R.stages.map(x => ({ ...x })); let deps = R.deps.map(x => ({ ...x }));

  for (const o of ops) { const f = fl.find(x => x.id === o.field);
    if (o.t === "lvl") { const l = lv.find(x => x.id === o.level); if (!l) continue; if (o.name != null) l.name = o.name; if (o.enabled != null) l.enabled = o.enabled; S.lvlDraft.add(l.id); }
    else if (o.t === "fadd") { fl.push({ id:o.field, name:o.name, type:o.type, config:o.config || {}, role:null, is_system:false, org_id:S.project.org_id, table_id:S.tbl.id }); place(o.field, o.before); S.fDraft.add(o.field); }
    else if (!f && ["fren","fdel","fopt","fmove","fremove"].includes(o.t)) continue;
    else if (o.t === "fren") { f.name = o.name; S.fDraft.add(f.id); }
    else if (o.t === "fdel") fl = fl.filter(x => x.id !== o.field);
    else if (o.t === "fopt") { f.config = { ...f.config, options: o.options.map(x => x.name), meta: Object.fromEntries(o.options.map(x => [x.name, { color:x.color, ...(x.all ? { all:true } : {}), ...(x.any ? { any:true } : {}), ...(x.row ? { row:x.row } : {}) }])) }; S.fDraft.add(f.id); }
    else if (o.t === "fmove") { if (f.role !== "title") place(o.field, o.before); }
    else if (o.t === "fremove") o.on ? removed.add(o.field) : removed.delete(o.field);
    else if (o.t === "pl_add") { pls.push({ id:o.pipeline, name:o.name, position: 999 }); S.plDraft.add(o.pipeline); }
    else if (o.t === "ps_add") { const mine = sts.filter(x => x.pipeline_id === o.pipeline); sts.push({ id:o.stage, pipeline_id:o.pipeline, name:o.name, position: mine.length ? Math.max(...mine.map(x => x.position)) + 1 : 1, default_hours:o.hours ?? null, gap_type:null, gap_hours:8 });
      if (o.after) deps.push({ stage_id:o.stage, depends_on_id:o.after }); S.plDraft.add(o.stage); }
    else if (o.t === "ps_set") { const st = sts.find(x => x.id === o.stage); if (st) { st[o.key] = o.value; S.plDraft.add(st.id); } }
    else if (o.t === "dep") { deps = deps.filter(d => !(d.stage_id === o.stage && d.depends_on_id === o.depends_on)); if (o.on) deps.push({ stage_id:o.stage, depends_on_id:o.depends_on }); S.plDraft.add(o.stage); } }

  const pos = Object.fromEntries(order.map((id, i) => [id, i]));

    ${parts.map((p, i) => { const d0 = p.deps?.[0] || {}, d1 = p.deps?.[1] || {}; const opts = cur => `<option value="">—</option>${parts.filter(x => x.id !== p.id).map(x => `<option value="${x.id}" ${x.id === cur ? "selected" : ""}>${esc(x.name)}</option>`).join("")}`;
      const at = (d, k) => `<span class="rmlag"><input type="number" min="0" max="100" step="5" data-rmdep="${p.id}|${k}|at" value="${RM.at(d)}" title="100 % = when it is finished · 50 % = when half is done (and it cannot end before it) · 0 % = together">%</span>`;
      return `<tr><td><button class="rmdotb" data-rmcolor="${p.id}" title="Click to pick the colour of ${esc(p.name)}"><i class="rmdot" style="background:${rmPal(i).solid}"></i></button></td><td><input class="in name" data-rmpart="${p.id}|name" value="${esc(p.name)}"></td><td><input class="in num" type="number" min="0" step="0.25" data-rmpart="${p.id}|days" value="${p.days}"></td>

  const keys = Array.from({ length: months }, (_, m) => RM.mkey(D.start, m)); const by = RMV.teamBy || "part"; const pop = RMV.pop;

      return `<td class="rmwdc ${off.length ? "hasoff" : ""} ${sel ? "sel" : ""}" data-rmwdc="${k}" title="${esc(`${k}: ${v} working days${off.length ? "\nDays off: " + off.map(x => rmFmt(RM.parse(x))).join(", ") : ""}\nClick to change the days off`)}">${v}${off.length ? `<i>−${off.length}</i>` : ""}</td>`; }).join("")}<td class="rmtot"></td><td class="rmest"></td></tr>`;
  const mhead = keys.map((k, m) => `<th>M${m + 1}<small>${mname(m)} ${k.slice(2, 4)}</small></th>`).join("");
  const seg = `<span class="seg rmtby"><button data-rmtby="part" aria-pressed="${by === "part"}">By part</button><button data-rmtby="person" aria-pressed="${by === "person"}">By person</button></span>`;
  let body = "";

    body = parts.map((p, i) => { const arr = D.team?.[p.id] || []; const mx = D.max?.[p.id]; const nd = need[p.id] || []; const u = C.useful[p.id] < (D.assets || []).length ? C.useful[p.id] : 0; const tot = sum((pm[p.id] || []).flatMap(a => a));
      const cells = keys.map((_, m) => { const v = RM.raw(arr, m), prev = m ? RM.raw(arr, m - 1) : null; const starts = v !== prev && (v != null || m > 0);
        const sel = pop && pop.pid === p.id && pop.ms.includes(m); const mdm = sum((pm[p.id] || []).map(a => a[m]));
        const tip = `${p.name} · M${m + 1} ${mname(m)}\nNeeded: ${rmPpl(Math.round((nd[m] || 0) * 10) / 10)} people on the project this month (as planned) · ${md(mdm) || 0} man-days\nLimit: ${v == null ? "none" : v + " people"}\nClick to set a limit · Shift+click to take several months`;
        return `<td class="rmcell ${v != null ? "lim" : ""} ${sel ? "sel" : ""}" data-rmcell="${p.id}|${m}" title="${esc(tip)}">${starts ? `<b class="rmlim">${v == null ? "∞" : "≤" + rmPpl(v)}</b>` : ""}<span>${nd[m] >= 0.05 ? rmPpl(Math.round(nd[m] * 10) / 10) : ""}</span></td>`; }).join("");
      return `<tr><td><i class="rmdot" style="background:${rmPal(i).solid}"></i> ${esc(p.name)}${u ? ` <small class="rmuse" title="More people than this do not move the end: the parts before cannot feed them faster">useful max ${u}</small>` : ""}</td><td><input class="in num" type="number" min="0" step="0.5" data-rmmax="${p.id}" value="${mx ?? ""}" placeholder="∞" title="The most people on this part over the whole plan · empty = no limit"></td>${cells}<td class="rmtot ${tot < est[p.id] - 0.5 ? "low" : ""}" title="${tot < est[p.id] - 0.5 ? `Fewer man-days on the project (${md(tot)}) than estimated (${md(est[p.id])})` : "Man-days of this part on the project"}">${md(tot)}</td><td class="rmest" title="${(D.assets || []).length} assets × ${rmDays(p.days)} d (+ days changed for single assets)">${md(est[p.id])}</td></tr>`; }).join("");
  } else {
    /* one row per person: their working days per month; typing a number makes it their availability that month (empty = not on the project) */
    for (const p of Sx.parts) { const P = Sx.people[p.id] || []; if (!P.length) continue; const c = rmPal(pidx[p.id]).solid;
      body += `<tr class="rmpgrp"><td colspan="${lead + months}"><i class="rmdot" style="background:${c}"></i> ${esc(p.name)} <small>${P.length} ${P.length > 1 ? "people" : "person"} · ${md(sum(pm[p.id].flatMap(a => a)))} man-days on the project · estimated ${md(est[p.id])}</small></td><td class="rmtot" title="Man-days of ${esc(p.name)} on the project">${md(sum(pm[p.id].flatMap(a => a)))}</td><td class="rmest" title="${(D.assets || []).length} assets × ${rmDays(p.days)} d">${md(est[p.id])}</td></tr>`;
      P.forEach((x, n) => { const av = D.avail?.[p.id]?.[x.k] || {}; const edited = Object.keys(av).length > 0; const row = pm[p.id][n];
        body += `<tr><td class="rmpn">${esc(p.name)} #${x.k + 1}${edited ? ` <button class="ico rmback" data-rmavreset="${p.id}|${x.k}" title="Back to plan: drop the days you typed for this person">↺</button>` : ""}</td><td class="r">${rmPpl(x.r * 8)} h</td><td class="l">${rmFmt(RM.dateOf(D.start, x.first))}</td><td class="l">${rmFmt(RM.dateOf(D.start, Math.max(x.first, x.last - 0.01)))}</td>${keys.map((k, m) => { const own = av[k] != null; const v = own ? av[k] : Math.round(row[m] / (x.r || 1));
          return `<td><input class="in num ${own ? "own" : "carry"}" type="number" min="0" max="31" step="1" data-rmav="${p.id}|${x.k}|${k}" value="${own ? av[k] : ""}" placeholder="${v >= 1 ? v : ""}" title="${esc(`${p.name} #${x.k + 1} · ${k}\n${own ? "Typed by you: " + av[k] + " days — the plan follows" : "As planned: " + (v || 0) + " working days"}\nType the days this person works this month · 0 = not on the project`)}"></td>`; }).join("")}<td class="rmtot">${md(sum(row))}</td><td class="rmest"></td></tr>`; }); }
    body += `<tr class="rmpgrp"><td colspan="${lead + months + 2}">Other roles <small>not in the pipeline — typed by hand, counted in the total</small></td></tr>`;
    (D.other || []).forEach((o, n) => { body += `<tr><td class="rmpn"><input class="in" data-rmo="${o.id}|name" value="${esc(o.name)}" placeholder="Role"> <button class="ico del" data-rmodel="${o.id}" title="Remove the role">✕</button></td><td><select data-rmo="${o.id}|hours"><option value="8" ${+o.hours !== 4 ? "selected" : ""}>8 h</option><option value="4" ${+o.hours === 4 ? "selected" : ""}>4 h</option></select></td><td></td><td></td>${keys.map(k => `<td><input class="in num own" type="number" min="0" max="31" step="0.5" data-rmo="${o.id}|${k}" value="${o.days?.[k] ?? ""}" placeholder="—"></td>`).join("")}<td class="rmtot">${md(sum(om[n]))}</td><td class="rmest"></td></tr>`; });

  }

  const cmp = [`Team: <b>${rmDays(Math.round(grand))}</b> man-days`, `estimate <b>${rmDays(Math.round(Sx.scope))}</b>`, Sx.scopeRisk > Sx.scope + 0.5 ? `with risks <b>${rmDays(Math.round(Sx.scopeRisk))}</b>` : "", D.contract ? `contract <b class="${grand > +D.contract + 0.5 ? "bad" : ""}">${rmDays(+D.contract)}</b>` : "", (D.other || []).length ? `other roles <b>${rmDays(Math.round(sum(om.flatMap(a => a))))}</b>` : ""].filter(Boolean).join(" · ");
  return `<section class="rmdata ${full ? "full" : ""}">${head}<div class="rmteambar">${seg}<span class="rmcmp" title="Man-days the team is on the project (people × their working days) — compare with what the work needs and what is sold; the gap is waiting and buffer">${cmp}</span></div><div class="rmteamwrap"><table class="editor rmteam rmteam2"><thead><tr><th>${by === "part" ? "Part" : "Person"}</th>${by === "part" ? `<th title="The most people on this part over the whole plan">Max<small>whole plan</small></th>` : `<th>Hours<small>a day</small></th><th>Start</th><th>End</th>`}${mhead}<th class="rmtoth" title="Man-days people are on the project">Total<small>on the project</small></th><th class="rmesth" title="Assets × days per asset — the work to cover by simple math">Estimated<small>assets × days</small></th></tr></thead><tbody>
    ${wdRow}${body}${totRow}</tbody></table></div>

/* days-off popover for one month */
function rmHolHtml(D, hp){ const off = RM.holidays(D).filter(x => x.startsWith(hp.key + "-")).sort(); const [y, m] = hp.key.split("-").map(Number);
  return `<div class="rmpop" style="left:${hp.x}px;top:${hp.y}px" data-rmpopbox>

    <label class="rmpop-f">Add a day off<input type="date" min="${hp.key}-01" max="${hp.key}-31" value="" data-rmholadd onkeydown="rmPopKey(event)"></label>
    <div class="rmpop-b"><span class="hint">${Array.isArray(D.holidays) ? "Your calendar" : "Ukraine 2027 calendar"}</span><span class="sp"></span><button class="btn" data-rmpop="close">Close</button></div></div>`; }

/* colour picker for a part */
function rmColorHtml(D, cp){ const i = (D.parts || []).findIndex(x => x.id === cp.pid); const p = D.parts[i]; if (!p) return ""; const cur = rmPal(i).solid.toLowerCase();
  return `<div class="rmpop rmcpop" style="left:${cp.x}px;top:${cp.y}px" data-rmpopbox><div class="rmpop-h">${esc(p.name)} · colour</div>

    <label class="rmpop-f">Own colour<input type="color" value="${cur}" data-rmswc></label>
    <div class="rmpop-b">${p.color ? `<button class="btn" data-rmsw="">Default</button>` : ""}<span class="sp"></span><button class="btn" data-rmpop="close">Close</button></div></div>`; }
/* the month-limit popover */
function rmPopHtml(D, pop, parts, mname){ const p = parts.find(x => x.id === pop.pid); if (!p) return ""; const arr = D.team?.[p.id] || []; const ms = [...pop.ms].sort((a, b) => a - b);
  const cur = RM.raw(arr, ms[0]); const label = ms.length > 1 ? `M${ms[0] + 1}–M${ms[ms.length - 1] + 1}` : `M${ms[0] + 1} ${mname(ms[0])}`; const many = ms.length > 1;
  return `<div class="rmpop" style="left:${pop.x}px;top:${pop.y}px" data-rmpopbox>
    <div class="rmpop-h">${esc(p.name)} · ${label}</div>
    <label class="rmpop-f">Limit, people<input type="number" min="0" step="0.5" value="${cur ?? ""}" placeholder="∞ no limit" data-rmpopv onkeydown="rmPopKey(event)"></label>
    <div class="rmpop-r"><label><input type="radio" name="rmpopw" value="only" ${pop.on ? "" : "checked"}> ${many ? "These months only" : "This month only"}</label><label><input type="radio" name="rmpopw" value="on" ${pop.on ? "checked" : ""}> From ${many ? "the first" : "this month"} on</label></div>
    <div class="rmpop-b">${cur != null ? `<button class="btn" data-rmpop="clear">Remove limit</button>` : ""}<span class="sp"></span><button class="btn" data-rmpop="close">Cancel</button><button class="btn primary" data-rmpop="set">Set limit</button></div></div>`; }
/* months → limit: only these months, or from the first one on; empty = no limit */
function rmSetLimit(pid, ms, v, on){ rmEdit(d => { d.team = d.team || {}; const arr = (d.team[pid] || []).slice(); const last = Math.max(...ms) + 2; while (arr.length < last) arr.push(RM.raw(arr, arr.length));
    if (on) { const m0 = Math.min(...ms); arr.length = m0 + 1; arr[m0] = v; } else for (const m of ms) arr[m] = v;
    while (arr.length > 1 && arr[arr.length - 1] === arr[arr.length - 2]) arr.pop(); if (arr.length === 1 && arr[0] == null) arr.length = 0; d.team[pid] = arr; },
    v == null ? "Limit removed" : `Limit ≤${v} set`); }
function rmPopApply(kind){ const pop = RMV.pop; if (!pop) return; const box = document.querySelector("[data-rmpopbox]");
  const raw = kind === "clear" ? "" : String(box?.querySelector("[data-rmpopv]")?.value ?? "").trim().replace(",", ".");
  const on = kind === "clear" ? !!box?.querySelector('input[value="on"]')?.checked : !!box?.querySelector('input[value="on"]')?.checked;
  RMV.pop = null; rmSetLimit(pop.pid, pop.ms, raw === "" ? null : Math.max(0, +raw || 0), on); }
function rmPopKey(e){ e.stopPropagation(); if (e.key === "Enter") { e.preventDefault(); if (RMV.pop) rmPopApply("set"); } else if (e.key === "Escape") { e.preventDefault(); RMV.pop = null; RMV.hpop = null; render(); } }
function rmPopFocus(){ requestAnimationFrame(() => { const i = document.querySelector("[data-rmpopv]"); if (i) { i.focus(); i.select(); } }); }

/* ----- export: CSV, Excel, PDF ----- */

          <p class="note">${f.role === "status" ? "<b>The order is the workflow.</b> Add stages your project needs (for example Art Director Review) and remove the ones it does not. " : ""}Renaming updates every row that uses the option. An option that rows still use cannot be removed until those rows are changed.${f.role === "status" ? `</p><p class="note"><b>Parent status.</b> A row with rows inside follows them: if <b>any</b> row inside has an “any” status, the parent takes it — from the row earliest in the pipeline (the one the others wait for); rows not linked by dependencies → the higher status in this list; if <b>all</b> rows inside share an “all” status, the parent takes that; otherwise the parent is <b>${esc(draft.find(o => !o.all && !o.any)?.name || "the first unmarked status")}</b> — the first status with neither mark. Set a parent by hand to override it (✎); right-click › Set status automatically to go back.</p><p class="note"><b>Finished work</b> — the plan skips it, Done counts it — is an “all” status that comes after ${esc(draft.find(o => !o.all && !o.any)?.name || "that one")}.` : ""}</p>`
        : `<table class="plain"><thead><tr><th style="width:36px">#</th><th>Name</th><th style="width:80px">Rows</th><th style="width:90px">State</th><th style="width:90px"></th></tr></thead><tbody>${S.levels.map((l, i) => { const n = S.tree.filter(r => r.level === l.name).length;
            return `<tr><td>${i + 1}</td><td><input data-lvl="${l.id}" value="${esc(l.name)}"></td><td>${n}</td><td>${l.enabled ? `<span class="tag">visible</span>` : `<span class="tag off">hidden</span>`}</td>
            <td><button class="tbtn" data-x="lvl" data-id="${l.id}" data-on="${l.enabled ? 0 : 1}" ${l.enabled && n ? "disabled title='Has rows'" : ""}>${l.enabled ? "Hide" : "Show"}</button></td></tr>`; }).join("")}</tbody></table>
          <p class="note"><b>All six levels always exist</b>; a new project shows three. Switch on Epic or Milestone to group batches, or Part to split a stage between people. A level that already has rows cannot be hidden.</p>`}</div>
      <div class="mfoot"><button class="tbtn" data-x="close">Close</button>${f ? `<button class="tbtn pri" data-x="save">Save ${f.role === "status" ? "workflow" : "options"}</button>` : ""}</div></div>`; };
  paint(); const paintNote = () => paint();
  v.addEventListener("input", e => { const row = e.target.closest(".orow"); if (!row || !e.target.dataset.k) return; const o = draft[+row.dataset.i]; const k = e.target.dataset.k; o[k] = k === "all" || k === "any" ? e.target.checked : e.target.value; if (k === "row") { const t = TINTS.find(z => z[0] === o.row) || TINTS[0]; const sw = row.querySelector(".tint i"); if (sw) sw.style.background = t[2] || "#fff"; } if (k === "all" || k === "any") paintNote(); });
  v.addEventListener("change", e => { if (e.target.dataset.lvl) { const name = e.target.value.trim(); if (!name) return toast("Level name cannot be empty", true);
    pushOps([{ t:"lvl", level:e.target.dataset.lvl, name }]); paint(); } });
  v.addEventListener("click", e => { if (e.target === v) return closeModal(); const b = e.target.closest("[data-x],[data-tab]"); if (!b) return;
    if (b.dataset.tab) { tab = b.dataset.tab; draft = null; return paint(); }
    const x = b.dataset.x, i = +(b.closest(".orow")?.dataset.i ?? -1);
    if (x === "close") return closeModal();
    if (x === "up") { [draft[i - 1], draft[i]] = [draft[i], draft[i - 1]]; return paint(); }
    if (x === "down") { [draft[i + 1], draft[i]] = [draft[i], draft[i + 1]]; return paint(); }
    if (x === "del") { draft.splice(i, 1); return paint(); }
    if (x === "add") { draft.push({ name:"", color:"#5980a6", all:false, any:false, row:"" }); paint(); const ins = v.querySelectorAll(".orow input[type=text]"); return ins[ins.length - 1]?.focus(); }
    if (x === "lvl") { pushOps([{ t:"lvl", level:b.dataset.id, enabled: b.dataset.on === "1" }]); return paint(); }
    if (x === "save") { if (draft.some(o => !o.name.trim())) return toast("Every option needs a name", true);
      const payload = draft.map(o => ({ name:o.name.trim(), color:o.color, ...(o.all ? { all:true } : {}), ...(o.any ? { any:true } : {}), ...(o.row ? { row:o.row } : {}), ...(o.was ? { was:o.was } : {}) })); const id = tab;
      if (new Set(payload.map(o => o.name)).size !== payload.length) return toast("Option names must be unique", true);
      const gone = (lists().find(x => x.id === id)?.config?.options || []).filter(o => !payload.some(p => p.was === o)); const used = gone.filter(o => S.tree.some(r => !r._del && r.data[id] === o));
      if (used.length) return toast(`“${used[0]}” is still used by rows — change them first`, true);
      closeModal(); pushOps([{ t:"fopt", field:id, options:payload }], "Saved to the draft — Apply to keep it"); } });
  v.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Escape") closeModal(); }); }

/* Structure: which levels the project has, and the groups above the asset level (milestones, batches…) with their dates */
function openStructure(){ closeModal(); const v = document.createElement("div"); v.className = "veil"; document.body.appendChild(v); let focusId = null;
  const UP = 3;   // levels above this position are groups; this position is the asset / task list
  const paint = () => { const dl = deadlineField(); const upper = S.tree.filter(r => (levelOf(r)?.position ?? 9) < UP); const ups = enabledLevels().filter(l => l.position < UP); const top = enabledLevels()[0];
    const inside = r => { const l = S.tree.filter(x => x.id !== r.id && !x._del && isUnder(x, r.id)); const a = S.levels.find(z => z.position === UP); const na = l.filter(x => levelOf(x)?.position === UP).length;
      return `${na} ${esc((a?.name || "asset").toLowerCase())}${na === 1 ? "" : "s"} · ${l.filter(x => x.is_leaf).length} work items`; };
    const row = (r, d) => `<div class="srow ${r._del ? "del" : ""}" style="padding-left:${d * 22}px" data-id="${r.id}"><span class="slv">${esc(r.level || "")}${r._new ? " · new" : ""}</span><input class="sn" data-n="${r.id}" value="${esc(r.title ?? "")}" ${r._del ? "disabled" : ""} aria-label="Name">
        <span class="sd" title="Earliest start of the work inside">${r.start_wh == null ? "—" : fmtDay(r.start_wh)}</span><span class="sd ${isLate(r) ? "late" : ""}" title="Latest end of the work inside">${r.end_wh == null ? "—" : fmtDay(r.end_wh, true)}</span>
        <input type="date" class="sdl" data-d="${r.id}" value="${esc((dl && r.data?.[dl.id]) || "")}" ${r._del ? "disabled" : ""} title="Deadline: the End turns red when the work inside ends later" aria-label="Deadline">
        <span class="sh">${inside(r)}</span>${r._del ? `<button class="tbtn" data-x="restore">Restore</button>` : `<button class="ib" data-x="clone" title="Clone with everything inside: estimates and realizers stay, fact and statuses start empty">⧉</button><button class="ib" data-x="del" title="Delete with everything inside (to the draft)">✕</button>`}</div>`;
    const draw = (pid, d) => upper.filter(r => (r.parent_id || null) === pid).map(r => { const cl = childLevel(r); const sub = cl && cl.position < UP;
      return row(r, d) + (sub ? draw(r.id, d + 1) + (r._del ? "" : `<div class="sadd" style="padding-left:${(d + 1) * 22}px"><button class="lnk" data-add="${r.id}">＋ ${esc(cl.name)}</button></div>`) : ""); }).join("");
    v.innerHTML = `<div class="modal wide"><div class="mhead"><span class="t">Structure</span><span class="sp"></span><button class="ib" data-x="close">✕</button></div><div class="mbody">
      <div class="sec">Levels of the project</div>
      <div class="lvls">${S.levels.map(l => { const n = S.tree.filter(r => r.level === l.name).length; return `<label class="lvl ${l.enabled ? "on" : ""}" title="${l.enabled && n ? "Has rows — it cannot be switched off" : ""}"><input type="checkbox" data-lon="${l.id}" ${l.enabled ? "checked" : ""} ${l.enabled && n ? "disabled" : ""}><input class="ln" data-lvl="${l.id}" value="${esc(l.name)}" aria-label="Level name"><span class="n">${n || ""}</span></label>`; }).join(`<span class="arr">›</span>`)}</div>
      <p class="note">Three levels are on by default. Switch on the first two to group batches into milestones and epics, or the last one to split a work item into parts. Rename any level to your own words: Asset → Task list, Stage → Task.</p>
      <div class="sec">${ups.map(l => esc(l.name) + "s").join(" · ") || "Groups"}<span class="shd"><span>Start</span><span>End</span><span>Deadline</span></span></div>
      ${ups.length ? `<div class="stree">${draw(null, 0) || `<div class="empty" style="padding:14px">Nothing here yet.</div>`}</div><div class="sadd"><button class="tbtn" data-add="">＋ ${esc(top.name)}</button></div>` : `<div class="empty" style="padding:14px">No level above ${esc(S.levels.find(z => z.position === UP)?.name || "the asset")} is switched on.</div>`}
      <p class="note">Start and End are collected from the plan of the work inside. Everything here goes to the <b>draft</b> and is saved by Apply.${dl ? "" : " The first deadline adds a “Deadline” column to the table."}</p></div>
      <div class="mfoot"><button class="tbtn pri" data-x="close">Close</button></div></div>`;
    if (focusId) { const i = v.querySelector(`[data-n="${focusId}"]`); focusId = null; if (i) { i.focus(); i.select(); } } };
  paint(); const again = () => { if (v.isConnected) paint(); };
  v.addEventListener("change", async e => { const el = e.target, d = el.dataset;
    if (d.lvl) { const name = el.value.trim(); if (!name) { toast("Level name cannot be empty", true); return paint(); } pushOps([{ t:"lvl", level:d.lvl, name }]); return again(); }
    if (d.lon) { if (!el.checked && S.tree.some(r => r.level_id === d.lon && !r._del)) { toast("This level has rows — it cannot be switched off", true); return paint(); } pushOps([{ t:"lvl", level:d.lon, enabled: el.checked }]); return again(); }
    if (d.n) { const val = el.value.trim(); if (!val) { toast("Name cannot be empty", true); return paint(); } draftCell(d.n, byRole("title"), val); render(); return paint(); }
    if (d.d) { const val = el.value || null; if (!deadlineField()) { if (!val) return; pushOps([{ t:"fadd", field: uid(), name:"Deadline", type:"date", config:{ pmkit:"deadline" }, before:null }]); }
      const f = deadlineField(); if (!f) return again(); draftCell(d.d, f, val); render(); return again(); } });
  v.addEventListener("click", e => { if (e.target === v) return closeModal(); const b = e.target.closest("button"); if (!b) return; const x = b.dataset.x; const r = S.row[b.closest(".srow")?.dataset.id];
    if (x === "close") return closeModal();
    if (b.dataset.add != null) { const par = S.row[b.dataset.add] || null; const L = par ? childLevel(par) : enabledLevels()[0]; if (!L) return; focusId = addGroup(par ? par.id : null, L); return again(); }
    if (!r) return;
    if (x === "clone") { focusId = cloneRow(r); return again(); }
    if (x === "del") { deleteRow(r); return paint(); }
    if (x === "restore") { restoreRow(r); return paint(); } });
  v.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Escape") closeModal(); else if (e.key === "Enter" && e.target.tagName === "INPUT") e.target.blur(); }); }

/* ---------------- time: working hours counted from a fixed Monday; 8 h a day, Mon–Fri ---------------- */
const HPD = 8, EPOCH = Date.UTC(2026, 0, 5), DAY = 864e5, DAYW = 36;
const STEPS = [[1, "1 hour"], [2, "2 hours"], [4, "Half a day"], [8, "1 day"]];
const calOfWd = D => Math.floor(D / 5) * 7 + (D % 5);
function whOfDate(ms){ const days = Math.floor((ms - EPOCH) / DAY); const w = Math.floor(days / 7), dow = days - w * 7; return dow > 4 ? (w + 1) * 5 * HPD : (w * 5 + dow) * HPD; }
function whOfIso(iso){ const ms = Date.parse(iso); const days = Math.floor((ms - EPOCH) / DAY); const dow = days - Math.floor(days / 7) * 7; const base = whOfDate(ms);
  if (dow > 4) return base; const h = (ms - (EPOCH + days * DAY)) / 36e5 - 9; return Math.round((base + Math.max(0, Math.min(HPD, h))) * 100) / 100; }
function isoOfWh(wh, isEnd){ let D = Math.floor(wh / HPD + 1e-9), h = wh - D * HPD; if (isEnd && h < 1e-9 && D > 0) { D -= 1; h = HPD; } return new Date(EPOCH + calOfWd(D) * DAY + (9 + h) * 36e5).toISOString(); }
const todayWh = () => { const n = new Date(); return whOfDate(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())); };
const fmtDay = (wh, isEnd) => new Date(EPOCH + calOfWd(Math.max(0, Math.floor((isEnd ? wh - 0.001 : wh) / HPD + 1e-9))) * DAY).toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"2-digit", timeZone:"UTC" });
const fmtWh = (wh, isEnd) => new Date(EPOCH + calOfWd(Math.max(0, Math.floor((isEnd ? wh - 0.001 : wh) / HPD + 1e-9))) * DAY).toLocaleDateString("en-GB", { day:"2-digit", month:"short", timeZone:"UTC" });
const asgOf = r => { const f = byRole("assignee"); return (f && r.data?.[f.id]) || null; };
function isDone(r){ const st = byRole("status"); const v = st && r.data?.[st.id]; if (!v) return false; const R = stRules(st), x = R.by[v];
  return !!x && x.all && x.i > R.fbIdx; }
const isUnder = (r, id) => { let x = r; while (x) { if (x.id === id) return true; x = S.row[x.parent_id]; } return false; };

/* the calendar strip both plan sheets draw on */
function planView(){ const segs = Object.values(S.segEff); const now = todayWh();
  const a = Math.min(now, ...segs.map(s => s.start)), b = Math.max(now + 15 * HPD, ...segs.map(s => s.end + (S.gapOf[s.record]?.hours || 0)));
  const c0raw = calOfWd(Math.max(0, Math.floor(a / HPD) - 2)); const c0 = c0raw - (c0raw % 7); const c1 = calOfWd(Math.ceil(b / HPD) + 6); const cal = [];
  for (let c = c0; c <= c1; c++) cal.push({ c, we: c % 7 > 4, date: new Date(EPOCH + c * DAY) });
  const x = wh => { const D = Math.floor(wh / HPD + 1e-9); return (calOfWd(D) - c0 + (wh - D * HPD) / HPD) * DAYW; };
  const xEnd = wh => { const D = Math.max(0, Math.floor((wh - 1e-6) / HPD)); return (calOfWd(D) - c0 + (wh - D * HPD) / HPD) * DAYW; };   // an end at the close of a day stays in that day
  const whAt = px => { const cf = px / DAYW + c0; let c = Math.floor(cf), fr = cf - c; const dow = ((c % 7) + 7) % 7; if (dow > 4) { c += 7 - dow; fr = 0; } const w = Math.floor(c / 7); return (w * 5 + (c - w * 7)) * HPD + fr * HPD; };
  return { cal, c0, x, xEnd, whAt, width: cal.length * DAYW, now }; }

/* what is wrong with the stored plan: nothing moves by itself, problems are only shown */
function planConflicts(){ const out = {}; const add = (id, m) => (out[id] ||= []).push(m); const segs = S.segEff;
  for (const [id, s] of Object.entries(segs)) { const r = S.row[id]; if (!r || isDone(r)) continue;
    if (Math.abs(s.hours - (+r.estimate_h || 0)) > 0.01) add(id, `Bar is ${num(s.hours)} h, estimate is ${num(r.estimate_h) || 0} h`);
    if ((s.assignee || null) !== asgOf(r)) add(id, `Planned for ${memberName(s.assignee) || "nobody"}, the row says ${memberName(asgOf(r)) || "nobody"}`);
    for (const d of S.depsOf[id] || []) { const ds = segs[d], dr = S.row[d]; if (!dr || isDone(dr)) continue;
      if (!ds) add(id, `“${dr.title}” is not on the plan yet`);
      else if (s.start < ds.end + (S.gapOf[d]?.hours || 0) - 0.01) add(id, `Starts before “${dr.title}” is finished${S.gapOf[d]?.hours ? " and reviewed" : ""}`); } }
  const by = {}; for (const [id, s] of Object.entries(segs)) if (s.assignee && S.row[id] && !isDone(S.row[id])) (by[s.assignee] ||= []).push([id, s]);
  for (const l of Object.values(by)) { l.sort((p, q2) => p[1].start - q2[1].start);
    for (let i = 1; i < l.length; i++) if (l[i][1].start < l[i - 1][1].end - 0.01) { add(l[i][0], `Overlaps with “${S.row[l[i - 1][0]].title}” (same person)`); add(l[i - 1][0], `Overlaps with “${S.row[l[i][0]].title}” (same person)`); } }
  return out; }

/* plan changes go to the draft in planning mode, or straight to the database in direct mode */
function planPayload(ops){ return ops.map(o => o.t === "cell" ? { t:"cell", record:o.record, field:o.field, value:o.value, base:o.base }
  : o.t === "seg" ? { t:"seg", record:o.record, start: isoOfWh(o.start), end: isoOfWh(o.end, true), hours:o.hours, assignee:o.assignee, version:o.version }
  : o.t === "unplan" ? { t:"unplan", record:o.record, version:o.version } : o.t === "del" ? { t:"del", record:o.record }
  : o.t === "move" ? { t:"move", record:o.record, parent:o.parent, before:o.before } : o); }
function commitPlanOps(ops, summary){ if (!ops.length) return render();
  draftPush(); const ids = new Set(ops.map(o => o.record)); S.draft.ops = S.draft.ops.filter(o => !((o.t === "seg" || o.t === "unplan") && ids.has(o.record))).concat(ops); saveDraft(); rebuild(); render(); toast(summary + " — in the draft, press Apply to save"); }
const segVersion = id => S.segAll[id]?.version ?? null;
function autoplan(all){ const now = todayWh(), step = S.step; const up = h => Math.ceil((h - 1e-9) / step) * step;
  const todo = S.tree.filter(r => r.is_leaf && !isDone(r) && +r.estimate_h > 0 && (all || !S.segEff[r.id])); if (!todo.length) return toast(all ? "No open work to plan" : "Everything open is already on the plan");
  const inTodo = new Set(todo.map(r => r.id)); const placed = {}, free = {};
  for (const [id, s] of Object.entries(S.segEff)) { const r = S.row[id]; if (!r || inTodo.has(id)) continue; placed[id] = s; if (s.assignee && !isDone(r)) free[s.assignee] = Math.max(free[s.assignee] || now, s.end); }
  const list = [...todo], ops = []; let guard = 0;
  while (list.length && guard++ < 9999) { let i = list.findIndex(r => (S.depsOf[r.id] || []).every(d => !list.some(x => x.id === d))); if (i < 0) i = 0; const r = list.splice(i, 1)[0];
    const who = asgOf(r); let start = who ? (free[who] || now) : now;
    for (const d of S.depsOf[r.id] || []) if (placed[d]) start = Math.max(start, placed[d].end + (S.gapOf[d]?.hours || 0));
    start = up(Math.max(start, now)); const hours = +r.estimate_h, end = start + hours; placed[r.id] = { start, end }; if (who) free[who] = end;
    ops.push({ t:"seg", record:r.id, start, end, hours, assignee:who, version: segVersion(r.id) }); }
  commitPlanOps(ops, all ? `Autoplan: ${ops.length} stages from today` : `Autoplan: ${ops.length} unplanned stages`); }
function barMenu(id, x, y){ const r = S.row[id], s = S.segEff[id]; if (!r || !s) return; const conf = planConflicts()[id] || []; const items = [{ head: r.title + " · " + fmtWh(s.start) + " → " + fmtWh(s.end, true) }];
  for (const c of conf) items.push({ label: "⚠ " + c, disabled:true });
  items.push("-", { label:"Fit the bar to the estimate", disabled: Math.abs(s.hours - (+r.estimate_h || 0)) < 0.01, run: () => commitPlanOps([{ t:"seg", record:id, start:s.start, end:s.start + (+r.estimate_h || 0), hours:+r.estimate_h || 0, assignee:s.assignee, version: segVersion(id) }], "Bar fitted: " + r.title) },
    { label:"Plan it for the row's realizer", disabled: (s.assignee || null) === asgOf(r), run: () => commitPlanOps([{ t:"seg", record:id, start:s.start, end:s.end, hours:s.hours, assignee: asgOf(r), version: segVersion(id) }], "Realizer updated: " + r.title) },
    "-", { label:"Remove from the plan", danger:true, run: () => commitPlanOps([{ t:"unplan", record:id, version: segVersion(id) }], "Removed from the plan: " + r.title) });
  openMenu(x, y, items); }

function clearFilters(){ S.flt = {}; S.hideDone = false; S.search = ""; saveTV(); render(); }
function draftBar(){ const n = S.draft.ops.length;
  return `<button class="tbtn ico" data-act="undo" title="Undo (${keyHint("undo")})" ${S.draft.undo.length ? "" : "disabled"}>↶</button><button class="tbtn ico" data-act="redo" title="Redo (${keyHint("redo")})" ${S.draft.redo.length ? "" : "disabled"}>↷</button><span class="tsep"></span>
    <button class="tbtn ${n ? "pri" : ""}" data-act="apply" title="Save the draft to the database (${keyHint("apply")})" ${n ? "" : "disabled"}>✓ Apply${n ? " · " + n : ""}</button><button class="tbtn ${S.showChanges ? "on" : ""}" data-act="changes" title="See every change in the draft and take back any one of them${keyHint("changes") ? " (" + keyHint("changes") + ")" : ""}">☰ Changes${n ? " · " + n : ""}</button><button class="tbtn" data-act="discard" title="Throw the draft away" ${n ? "" : "disabled"}>✕ Discard</button><span class="tsep"></span>`; }
/* ---- the Changes panel: every change in the draft, newest first; ✕ takes back just that one ---- */
function fmtVal(f, v){ if (v == null || v === "") return "—"; if (!f) return String(v); if (f.type === "person") return memberName(v) || "?"; if (f.type === "checkbox") return v ? "✓" : "✗";
  if (f.type === "link") return v.caption || v.url || "link"; if (["duration","number","money"].includes(f.type)) return num(v) + (f.type === "duration" ? " h" : ""); return String(v); }
function opInfo(o){ const fld = id => S.allFields.find(f => f.id === id) || S.raw.fields.find(f => f.id === id); const row = id => S.row[id]?.title || S.base.find(r => r.id === id)?.title || "a row";
  const stage = id => S.stages.find(x => x.id === id)?.name || S.raw.stages.find(x => x.id === id)?.name || "a stage";
  switch (o.t) {
    case "cell": { const f = fld(o.field); return { k:"Edit", t: row(o.record), d: `${f?.name || "?"}: ${fmtVal(f, o.base)} → ${fmtVal(f, o.value)}`, go:["tracker", o.record] }; }
